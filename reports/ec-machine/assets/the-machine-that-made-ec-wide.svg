<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">The Machine That Made EC</title>
  <desc id="desc">Eight existing media, printing, advertising, distribution, and audience systems feed promotional comic booklets, followed by newsstand comic books, original genre comics, Educational Comics, EC New Trend, Tales from the Crypt, MAD, paperback collections, and A Hard Day's Night.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#170d0b"/>
      <stop offset="0.48" stop-color="#090c0d"/>
      <stop offset="1" stop-color="#10160f"/>
    </linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5d211b"/>
      <stop offset="1" stop-color="#2c371f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6684c"/>
    </marker>
    <style>
      .label { fill: #dbb64b; font: 700 17px Arial, Helvetica, sans-serif; letter-spacing: 4px; }
      .title { fill: #f2e8d1; font: 700 48px Georgia, 'Times New Roman', serif; }
      .deck { fill: #aaa193; font: 400 21px Arial, Helvetica, sans-serif; }
      .input rect { fill: #111517; stroke: #50463b; stroke-width: 2; }
      .input text { fill: #e7ddc9; font: 700 21px Arial, Helvetica, sans-serif; }
      .input .small { fill: #958d82; font: 400 16px Arial, Helvetica, sans-serif; }
      .flow { fill: none; stroke: #6b5a48; stroke-width: 3; opacity: 0.75; }
      .arrow { fill: none; stroke: #d6684c; stroke-width: 4; marker-end: url(#arrow); }
      .hub-title { fill: #fff2d7; font: 700 25px Arial, Helvetica, sans-serif; letter-spacing: 1px; }
      .hub-sub { fill: #d8c8b2; font: 400 17px Arial, Helvetica, sans-serif; }
      .stage rect { fill: #111516; stroke: #586048; stroke-width: 2; }
      .stage text { fill: #efe5d0; font: 700 20px Arial, Helvetica, sans-serif; }
      .stage .small { fill: #9f9789; font: 400 15px Arial, Helvetica, sans-serif; }
      .ec rect { fill: #1d1210; stroke: #874b39; }
      .mad rect { fill: #15170f; stroke: #9d8230; }
      .final rect { fill: #182215; stroke: #718f51; stroke-width: 3; }
      .footer { fill: #756f66; font: 400 15px Arial, Helvetica, sans-serif; letter-spacing: 1px; }
    </style>
  </defs>

  <rect width="1600" height="1200" fill="url(#bg)"/>
  <rect x="38" y="38" width="1524" height="1124" rx="18" fill="none" stroke="#554737" stroke-width="2"/>
  <text x="80" y="92" class="label">MAGAZINE TIME MACHINE / FORMAT HISTORY</text>
  <text x="80" y="148" class="title">The Machine That Made EC</text>

  <g class="input">
    <g transform="translate(80 188)">
      <rect width="330" height="94" rx="8"/>
      <text x="20" y="37">Newspaper strips</text>
      <text x="20" y="65" class="small">syndicates + recurring characters</text>
    </g>
    <g transform="translate(450 188)">
      <rect width="330" height="94" rx="8"/>
      <text x="20" y="37">Sunday color</text>
      <text x="20" y="65" class="small">large pages + four-color printing</text>
    </g>
    <g transform="translate(820 188)">
      <rect width="330" height="94" rx="8"/>
      <text x="20" y="37">Pulp genres</text>
      <text x="20" y="65" class="small">crime, horror, science fiction</text>
    </g>
    <g transform="translate(1190 188)">
      <rect width="330" height="94" rx="8"/>
      <text x="20" y="37">Radio storytelling</text>
      <text x="20" y="65" class="small">anthologies, hosts, serial ritual</text>
    </g>
    <g transform="translate(80 316)">
      <rect width="330" height="94" rx="8"/>
      <text x="20" y="37">Advertisers</text>
      <text x="20" y="65" class="small">premiums + coupon offers</text>
    </g>
    <g transform="translate(450 316)">
      <rect width="330" height="94" rx="8"/>
      <text x="20" y="37">Cheap paper + presses</text>
      <text x="20" y="65" class="small">available industrial capacity</text>
    </g>
    <g transform="translate(820 316)">
      <rect width="330" height="94" rx="8"/>
      <text x="20" y="37">Newsstand distribution</text>
      <text x="20" y="65" class="small">a national rack already in place</text>
    </g>
    <g transform="translate(1190 316)">
      <rect width="330" height="94" rx="8"/>
      <text x="20" y="37">Depression audiences</text>
      <text x="20" y="65" class="small">cheap, portable entertainment</text>
    </g>
  </g>

  <g class="flow">
    <path d="M245 282 C245 430 650 425 720 486"/>
    <path d="M615 282 C615 410 710 430 750 486"/>
    <path d="M985 282 C985 410 890 430 850 486"/>
    <path d="M1355 282 C1355 430 950 425 880 486"/>
    <path d="M245 410 C245 470 640 450 720 486"/>
    <path d="M615 410 C615 450 710 460 750 486"/>
    <path d="M985 410 C985 450 890 460 850 486"/>
    <path d="M1355 410 C1355 470 960 450 880 486"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="535" y="476" width="530" height="112" rx="12" fill="url(#hub)" stroke="#c26a48" stroke-width="3"/>
    <text x="800" y="521" text-anchor="middle" class="hub-title">PROMOTIONAL COMIC BOOKLETS</text>
    <text x="800" y="554" text-anchor="middle" class="hub-sub">reprinted newspaper strips + branded giveaway</text>
  </g>

  <path class="arrow" d="M800 588 V624 H180 V650"/>

  <g class="stage">
    <g transform="translate(70 650)">
      <rect width="220" height="108" rx="8"/>
      <text x="110" y="43" text-anchor="middle">Newsstand</text>
      <text x="110" y="69" text-anchor="middle">comic books</text>
      <text x="110" y="92" text-anchor="middle" class="small">ten-cent container</text>
    </g>
    <g transform="translate(380 650)">
      <rect width="220" height="108" rx="8"/>
      <text x="110" y="43" text-anchor="middle">Original</text>
      <text x="110" y="69" text-anchor="middle">genre comics</text>
      <text x="110" y="92" text-anchor="middle" class="small">new stories + IP</text>
    </g>
    <g transform="translate(690 650)">
      <rect width="220" height="108" rx="8"/>
      <text x="110" y="43" text-anchor="middle">Educational</text>
      <text x="110" y="69" text-anchor="middle">Comics</text>
      <text x="110" y="92" text-anchor="middle" class="small">approved knowledge</text>
    </g>
    <g transform="translate(1000 650)" class="ec">
      <rect width="220" height="108" rx="8"/>
      <text x="110" y="43" text-anchor="middle">EC New Trend</text>
      <text x="110" y="69" text-anchor="middle">genre machine</text>
      <text x="110" y="92" text-anchor="middle" class="small">voice + artists + fans</text>
    </g>
    <g transform="translate(1310 650)" class="ec">
      <rect width="220" height="108" rx="8"/>
      <text x="110" y="43" text-anchor="middle">Tales from</text>
      <text x="110" y="69" text-anchor="middle">the Crypt</text>
      <text x="110" y="92" text-anchor="middle" class="small">horror anthology</text>
    </g>
  </g>

  <path class="arrow" d="M290 704 H366"/>
  <path class="arrow" d="M600 704 H676"/>
  <path class="arrow" d="M910 704 H986"/>
  <path class="arrow" d="M1220 704 H1296"/>
  <path class="arrow" d="M1420 758 V812"/>

  <g class="stage">
    <g transform="translate(1200 830)" class="mad">
      <rect width="260" height="108" rx="8"/>
      <text x="130" y="43" text-anchor="middle">MAD comic</text>
      <text x="130" y="69" text-anchor="middle" class="small">satire in comic-book form</text>
    </g>
    <g transform="translate(860 830)" class="mad">
      <rect width="260" height="108" rx="8"/>
      <text x="130" y="43" text-anchor="middle">MAD magazine</text>
      <text x="130" y="69" text-anchor="middle" class="small">larger format, outside the Code</text>
    </g>
    <g transform="translate(520 830)" class="mad">
      <rect width="260" height="108" rx="8"/>
      <text x="130" y="43" text-anchor="middle">Paperback</text>
      <text x="130" y="69" text-anchor="middle">collections</text>
      <text x="130" y="92" text-anchor="middle" class="small">the rack changes again</text>
    </g>
    <g transform="translate(140 830)" class="final">
      <rect width="300" height="108" rx="8"/>
      <text x="150" y="42" text-anchor="middle">A Hard Day’s Night</text>
      <text x="150" y="70" text-anchor="middle" class="small">Shake reads Son of Mad</text>
      <text x="150" y="92" text-anchor="middle" class="small">1964</text>
    </g>
  </g>

  <path class="arrow" d="M1200 884 H1134"/>
  <path class="arrow" d="M860 884 H794"/>
  <path class="arrow" d="M520 884 H454"/>

  <text x="800" y="1014" text-anchor="middle" class="title" font-size="37">The content changed. The machinery traveled.</text>
  <text x="800" y="1058" text-anchor="middle" class="deck">Each container carried forward some mix of format, distribution, voice, and reader ritual.</text>
  <line x1="380" y1="1096" x2="1220" y2="1096" stroke="#554737" stroke-width="2"/>
  <text x="800" y="1132" text-anchor="middle" class="footer">ORIGINAL HOBFARM EDITORIAL GRAPHIC / 2026</text>
</svg>
