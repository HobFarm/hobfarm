      <text x="42" y="111" fill="#171411" font-family="Georgia, serif" font-size="38" font-weight="700">KURT F. SCHNEIDER</text>
      <text x="42" y="180" fill="#315c6a" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="800" letter-spacing="1.4">HARRY EARLES</text>
