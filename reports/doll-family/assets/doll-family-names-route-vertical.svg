    </g>

    <g transform="translate(88 1205) rotate(0.4 452 105)" filter="url(#paper-noise)">
      <rect width="904" height="210" rx="7" fill="#eadfc9"/>
      <rect x="0" y="0" width="17" height="210" fill="#315c6a"/>
      <path d="M42 64H870M42 137H870" stroke="#c8b99d" stroke-width="2"/>
