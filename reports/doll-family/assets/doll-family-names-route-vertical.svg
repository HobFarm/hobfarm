      <text x="42" y="45" fill="#8a7b68" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="3">BIRTH RECORD</text>
      <text x="42" y="111" fill="#171411" font-family="Georgia, serif" font-size="38" font-weight="700">FRIEDA A. SCHNEIDER</text>
      <text x="42" y="180" fill="#a23e32" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="800" letter-spacing="1.4">GRACIE DOLL</text>
    </g>

