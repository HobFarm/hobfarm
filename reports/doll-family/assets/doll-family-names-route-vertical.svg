<?xml version="1.0" encoding="UTF-8"?>
  <svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
    <defs>
    <filter id="paper-noise" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="faded">
        <feFuncA type="table" tableValues="0 .13"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faded" mode="multiply"/>
    </filter>
    <pattern id="rule-lines" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M0 47.5H48" stroke="#c8b99d" stroke-opacity=".18"/>
    </pattern>
  </defs>
    <rect width="1080" height="1920" fill="#090806"/>
    <rect x="45" y="42" width="990" height="1836" rx="10" fill="#171411" stroke="#c8b99d" stroke-width="3"/>
    <rect x="45" y="42" width="990" height="1836" fill="url(#rule-lines)" opacity=".5"/>
    <text x="86" y="115" fill="#d4a354" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" letter-spacing="5">MAGAZINE TIME MACHINE</text>
    <text x="86" y="265" fill="#eadfc9" font-family="Georgia, serif" font-size="106" font-weight="700">THEY HAD</text>
    <text x="86" y="365" fill="#eadfc9" font-family="Georgia, serif" font-size="106" font-weight="700">NAMES</text>
    <text x="90" y="424" fill="#c8b99d" font-family="Arial, Helvetica, sans-serif" font-size="23" letter-spacing="3">THE DOLL FAMILY FROM FREAKS TO SARASOTA</text>


