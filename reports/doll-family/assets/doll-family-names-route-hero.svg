<?xml version="1.0" encoding="UTF-8"?>
  <svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1350" viewBox="0 0 2400 1350">
    <defs>
    <filter id="paper-noise" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="faded">
        <feFuncA type="table" tableValues="0 .13"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faded" mode="multiply"/>
    </filter>
    <pattern id="rule-lines" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M0 47.5H48" stroke="#c8b99d" stroke-opacity=".18"/>
    </pattern>
  </defs>
    <rect width="2400" height="1350" fill="#090806"/>
    <rect x="54" y="48" width="2292" height="1254" rx="12" fill="#171411" stroke="#c8b99d" stroke-width="3"/>
    <path d="M54 305H2346M54 1082H2346" stroke="#c8b99d" stroke-opacity=".23" stroke-width="2"/>
    <rect x="54" y="48" width="2292" height="1254" fill="url(#rule-lines)" opacity=".55"/>

    <text x="120" y="122" fill="#d4a354" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" letter-spacing="8">MAGAZINE TIME MACHINE / FAMILY FILE</text>
    <text x="120" y="245" fill="#eadfc9" font-family="Georgia, serif" font-size="112" font-weight="700" letter-spacing="-3">THEY HAD NAMES</text>
