<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1125" viewBox="0 0 1800 1125" role="img" aria-labelledby="title desc">
  <title id="title">THE AGENTIC CORRECTION LOOP</title>
  <desc id="desc">The agent can write the fix. The human still notices when the fix becomes the next bug.</desc>
  <defs>
    <filter id="paper-noise" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="14" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.07"/>
      </feComponentTransfer>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#a95a3f"/>
    </marker>
    <marker id="arrow-faded" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#81786a"/>
    </marker>
  </defs>
  <rect width="1800" height="1125" fill="#171b21"/>
  <rect x="28" y="28" width="1744" height="1069" rx="24" fill="none" stroke="#c7b58e" stroke-width="3"/>
  <rect width="1800" height="1125" filter="url(#paper-noise)" opacity="0.55"/>
  <text x="90" y="102" fill="#e6d7b7" font-family="Georgia, serif" font-size="56" font-weight="700" letter-spacing="2">THE AGENTIC CORRECTION LOOP</text>
  <text x="92" y="146" fill="#c7b58e" font-family="Arial, sans-serif" font-size="25">The agent can write the fix. The human still notices when the fix becomes the next bug.</text>

  <path d="M375 313 H390 M710 313 H725 M1045 313 H1060 M1380 313 H1395" stroke="#a95a3f" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M1562 398 C1610 490 1580 610 1510 652" fill="none" stroke="#a95a3f" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M1242 755 H1160 M840 755 H758 M438 755 H356" stroke="#a95a3f" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M188 670 C86 610 75 505 150 414" fill="none" stroke="#a95a3f" stroke-width="5" marker-end="url(#arrow)"/>

    <rect x="70" y="228" width="305" height="170" rx="12" fill="#25272a" stroke="#a95a3f" stroke-width="4"/>
    <circle cx="113" cy="270" r="25" fill="#a95a3f"/>
    <text x="113" y="278" text-anchor="middle" fill="#f3ead6" font-family="Arial, sans-serif" font-size="20" font-weight="700">01</text>
    <text x="94" y="328" fill="#f3ead6" font-family="Arial, sans-serif" font-size="24" font-weight="700">HUMAN NOTICES</text>
    <text x="94" y="365" fill="#c7b58e" font-family="Arial, sans-serif" font-size="19">friction, drift, or failure</text>
    <rect x="405" y="228" width="305" height="170" rx="12" fill="#25272a" stroke="#457d79" stroke-width="4"/>
    <circle cx="448" cy="270" r="25" fill="#457d79"/>
    <text x="448" y="278" text-anchor="middle" fill="#f3ead6" font-family="Arial, sans-serif" font-size="20" font-weight="700">02</text>
    <text x="429" y="328" fill="#f3ead6" font-family="Arial, sans-serif" font-size="24" font-weight="700">MODEL EXPLAINS</text>
    <text x="429" y="365" fill="#c7b58e" font-family="Arial, sans-serif" font-size="19">a diagnosis is generated</text>
    <rect x="740" y="228" width="305" height="170" rx="12" fill="#25272a" stroke="#a95a3f" stroke-width="4"/>
    <circle cx="783" cy="270" r="25" fill="#a95a3f"/>
    <text x="783" y="278" text-anchor="middle" fill="#f3ead6" font-family="Arial, sans-serif" font-size="20" font-weight="700">03</text>
    <text x="764" y="328" fill="#f3ead6" font-family="Arial, sans-serif" font-size="24" font-weight="700">HUMAN VERIFIES</text>
    <text x="764" y="365" fill="#c7b58e" font-family="Arial, sans-serif" font-size="19">against the real system</text>
    <rect x="1075" y="228" width="305" height="170" rx="12" fill="#25272a" stroke="#457d79" stroke-width="4"/>
    <circle cx="1118" cy="270" r="25" fill="#457d79"/>
    <text x="1118" y="278" text-anchor="middle" fill="#f3ead6" font-family="Arial, sans-serif" font-size="20" font-weight="700">04</text>
    <text x="1099" y="328" fill="#f3ead6" font-family="Arial, sans-serif" font-size="24" font-weight="700">AGENT WRITES</text>
    <text x="1099" y="365" fill="#c7b58e" font-family="Arial, sans-serif" font-size="19">rule, skill, script, or repair</text>
    <rect x="1410" y="228" width="305" height="170" rx="12" fill="#25272a" stroke="#6e8461" stroke-width="4"/>
    <circle cx="1453" cy="270" r="25" fill="#6e8461"/>
    <text x="1453" y="278" text-anchor="middle" fill="#f3ead6" font-family="Arial, sans-serif" font-size="20" font-weight="700">05</text>
    <text x="1434" y="328" fill="#f3ead6" font-family="Arial, sans-serif" font-size="24" font-weight="700">TESTS PASS</text>
    <text x="1434" y="365" fill="#c7b58e" font-family="Arial, sans-serif" font-size="19">the immediate fix holds</text>
    <rect x="1242" y="670" width="305" height="170" rx="12" fill="#25272a" stroke="#6e8461" stroke-width="4"/>
    <circle cx="1285" cy="712" r="25" fill="#6e8461"/>
    <text x="1285" y="720" text-anchor="middle" fill="#f3ead6" font-family="Arial, sans-serif" font-size="20" font-weight="700">06</text>
    <text x="1266" y="770" fill="#f3ead6" font-family="Arial, sans-serif" font-size="24" font-weight="700">WORKFLOW IMPROVES</text>
    <text x="1266" y="807" fill="#c7b58e" font-family="Arial, sans-serif" font-size="19">the fix becomes infrastructure</text>
    <rect x="840" y="670" width="305" height="170" rx="12" fill="#25272a" stroke="#765477" stroke-width="4"/>
    <circle cx="883" cy="712" r="25" fill="#765477"/>
    <text x="883" y="720" text-anchor="middle" fill="#f3ead6" font-family="Arial, sans-serif" font-size="20" font-weight="700">07</text>
    <text x="864" y="770" fill="#f3ead6" font-family="Arial, sans-serif" font-size="24" font-weight="700">THE WORLD CHANGES</text>
    <text x="864" y="807" fill="#c7b58e" font-family="Arial, sans-serif" font-size="19">projects, models, tools, scope</text>
    <rect x="438" y="670" width="305" height="170" rx="12" fill="#25272a" stroke="#a95a3f" stroke-width="4"/>
    <circle cx="481" cy="712" r="25" fill="#a95a3f"/>
    <text x="481" y="720" text-anchor="middle" fill="#f3ead6" font-family="Arial, sans-serif" font-size="20" font-weight="700">08</text>
    <text x="462" y="770" fill="#f3ead6" font-family="Arial, sans-serif" font-size="24" font-weight="700">THE RULE DRIFTS</text>
    <text x="462" y="807" fill="#c7b58e" font-family="Arial, sans-serif" font-size="19">stale, broad, or conflicting</text>
    <rect x="36" y="670" width="305" height="170" rx="12" fill="#25272a" stroke="#a95a3f" stroke-width="4"/>
    <circle cx="79" cy="712" r="25" fill="#a95a3f"/>
    <text x="79" y="720" text-anchor="middle" fill="#f3ead6" font-family="Arial, sans-serif" font-size="20" font-weight="700">09</text>
    <text x="60" y="770" fill="#f3ead6" font-family="Arial, sans-serif" font-size="24" font-weight="700">FAILURE RETURNS</text>
    <text x="60" y="807" fill="#c7b58e" font-family="Arial, sans-serif" font-size="19">the corrective layer needs audit</text>
  <rect x="410" y="468" width="980" height="126" rx="63" fill="#e6d7b7" stroke="#a95a3f" stroke-width="5"/>
  <text x="900" y="520" text-anchor="middle" fill="#11100e" font-family="Georgia, serif" font-size="29" font-weight="700">THE CORRECTION BECOMES INFRASTRUCTURE</text>
  <text x="900" y="560" text-anchor="middle" fill="#5f5545" font-family="Arial, sans-serif" font-size="22">and infrastructure becomes another maintenance surface</text>
  <text x="90" y="1047" fill="#c7b58e" font-family="Georgia, serif" font-size="27" font-style="italic">This is human-directed externalized correction, not autonomous self-correction.</text>
  </svg>
