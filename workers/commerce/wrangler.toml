name = "hobfarm-commerce"
main = "src/index.ts"
compatibility_date = "2026-08-06"
compatibility_flags = ["nodejs_compat"]

# This Worker has no public route. It is intended for remote inspection during
# setup and, later, a service binding from the HobFarm Pages project.
workers_dev = false

[[send_email]]
name = "CONTACT_EMAIL"
allowed_sender_addresses = ["contact@forms.hob.farm"]
allowed_destination_addresses = ["support@hob.farm", "hey@hob.farm"]

[[d1_databases]]
binding = "COMMERCE_DB"
database_name = "hobfarm-commerce-db"
database_id = "d8d6c0d6-7511-4b25-8610-e9e0f6090cf4"
migrations_dir = "migrations"

[[queues.producers]]
binding = "FULFILLMENT_QUEUE"
queue = "hobfarm-fulfillment"

[[queues.consumers]]
queue = "hobfarm-fulfillment"

[[secrets_store_secrets]]
binding = "PRINTFUL_API_TOKEN"
store_id = "e1efb254fa9e40359b0b3bdeab02b082"
secret_name = "printful"

[vars]
# All fulfillment mutations stay off until a sample is approved and the
# Stripe-to-ledger rehearsal has passed in the deployed environment.
FULFILLMENT_EXECUTION_ENABLED = "false"
PRINTFUL_DRAFT_CREATION_ENABLED = "false"
PRINTFUL_CONFIRMATION_ENABLED = "false"
PRINTFUL_MAX_ORDER_COST_AMOUNT = "0"

[triggers]
crons = ["*/15 * * * *"]

[observability]
enabled = true
