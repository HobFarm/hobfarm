    <rect x="34" y="34" width="320" height="430" rx="5" fill="#8b332d" opacity=".7"/>
    <rect x="18" y="18" width="320" height="430" rx="5" fill="#d3c099"/>
    <rect width="320" height="430" rx="5" fill="url(#paper)" stroke="#171415" stroke-width="3"/>
