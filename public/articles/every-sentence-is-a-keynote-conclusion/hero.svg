      <rect x="232" y="11" width="102" height="72" rx="4" fill="#151314" stroke="#968286" stroke-width="4"/>
      <circle cx="258" cy="47" r="11" fill="#c9ed4e"/>
      <circle cx="290" cy="47" r="11" fill="#e54c40"/>
      <circle cx="320" cy="47" r="11" fill="#7664d7"/>
    </g>
    <path d="M45 544h365" stroke="#0d0b0c" stroke-width="9"/>
    <path d="M76 565h304" stroke="#968286" stroke-width="5" stroke-dasharray="22 12"/>
  </g>

  <g transform="translate(963 436)">
