      <rect x="236" y="263" width="174" height="49" fill="#e54c40" stroke="#171415" stroke-width="2"/>
      <text x="252" y="293" fill="#fff8e8">TIDY TRIPLET</text>
      <rect x="44" y="328" width="174" height="49" fill="#29bfd0" stroke="#171415" stroke-width="2"/>
      <text x="59" y="358" fill="#102226">HUMANIST END</text>
      <rect x="236" y="328" width="174" height="49" fill="#c9ed4e" stroke="#171415" stroke-width="2"/>
      <text x="252" y="358" fill="#171415">FOLLOW CTA</text>
    </g>
    <g transform="translate(74 414)">
      <circle cx="47" cy="47" r="42" fill="#191617" stroke="#968286" stroke-width="6"/>
      <circle cx="47" cy="47" r="11" fill="#e54c40"/>
      <path d="M47 13v20M47 61v20M13 47h20M61 47h20" stroke="#f1e7cf" stroke-width="5"/>
      <circle cx="154" cy="47" r="42" fill="#191617" stroke="#968286" stroke-width="6"/>
      <circle cx="154" cy="47" r="11" fill="#29bfd0"/>
