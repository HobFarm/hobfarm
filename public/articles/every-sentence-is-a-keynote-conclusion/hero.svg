<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Research enters a rhetorical assembly line</title>
  <desc id="desc">A research paper and loose source notes enter a machine that produces identical polished pages. A second belt carries a visibly revised article covered in annotations and irregular marks.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171415"/>
      <stop offset="0.58" stop-color="#282023"/>
      <stop offset="1" stop-color="#0f1e24"/>
    </linearGradient>
    <linearGradient id="machine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#53484a"/>
      <stop offset="0.5" stop-color="#2d282a"/>
      <stop offset="1" stop-color="#171416"/>
    </linearGradient>
    <linearGradient id="belt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#231f20"/>
      <stop offset="0.46" stop-color="#41383a"/>
      <stop offset="1" stop-color="#1b1819"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8e8"/>
      <stop offset="1" stop-color="#e4d2ad"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#f3e5c2" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <pattern id="beltRibs" width="54" height="28" patternUnits="userSpaceOnUse" patternTransform="skewX(-18)">
      <rect width="54" height="28" fill="none"/>
      <path d="M2 0v28" stroke="#948286" stroke-opacity=".25" stroke-width="3"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#000" flood-opacity=".42"/>
    </filter>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="2" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="soft">
        <feFuncA type="table" tableValues="0 .08"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="soft" mode="multiply"/>
    </filter>
    <clipPath id="paperClip"><rect x="0" y="0" width="278" height="360" rx="4"/></clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <path d="M0 738C315 670 487 744 746 694c303-58 527-184 854-154v360H0Z" fill="#0d1114" opacity=".75"/>
  <path d="M0 717C292 656 509 728 754 678c302-62 525-177 846-153" fill="none" stroke="#29bfd0" stroke-opacity=".18" stroke-width="2"/>

