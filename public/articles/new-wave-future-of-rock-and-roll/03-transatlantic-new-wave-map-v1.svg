    <rect x="500" y="270" width="320" height="54" rx="27" fill="#11191c" stroke="#168eaa" stroke-width="3"/><text x="660" y="304" fill="#eee6cf" text-anchor="middle">ENO + TALKING HEADS / 1978-80</text>
    <rect x="505" y="430" width="318" height="54" rx="27" fill="#11191c" stroke="#e54b4b" stroke-width="3"/><text x="664" y="464" fill="#eee6cf" text-anchor="middle">DEVO TO GERMANY / 1978</text>
    <rect x="560" y="700" width="290" height="54" rx="27" fill="#11191c" stroke="#168eaa" stroke-width="3"/><text x="705" y="734" fill="#eee6cf" text-anchor="middle">MORODER TO FILM + POP</text>
    <rect x="510" y="545" width="380" height="54" rx="27" fill="#11191c" stroke="#e54b4b" stroke-width="3"/><text x="700" y="579" fill="#eee6cf" text-anchor="middle">FUNK / R&amp;B / AFROBEAT FEEDBACK</text>
  </g>
  <text x="70" y="846" fill="#8e9997" font-family="Consolas, monospace" font-size="15">SOLID = DOCUMENTED COLLABORATION OR RELEASE PATH   DASHED = BROADER CULTURAL AND RHYTHMIC EXCHANGE DISCUSSED IN PROSE</text>
</svg>