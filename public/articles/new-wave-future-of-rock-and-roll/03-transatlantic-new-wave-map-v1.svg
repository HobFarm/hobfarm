  <text x="920" y="280" fill="#59696c" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="900">EUROPE</text>
  <g><circle cx="270" cy="420" r="15" fill="#f0c74f" stroke="#fff" stroke-width="3"/><text x="270" y="390" fill="#eee6cf" text-anchor="middle" font-family="Consolas, monospace" font-size="22" font-weight="800">NEW YORK</text><text x="270" y="462" fill="#98a5a3" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18">Talking Heads</text></g><g><circle cx="180" cy="535" r="15" fill="#e54b4b" stroke="#fff" stroke-width="3"/><text x="180" y="505" fill="#eee6cf" text-anchor="middle" font-family="Consolas, monospace" font-size="22" font-weight="800">AKRON</text><text x="180" y="577" fill="#98a5a3" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18">Devo</text></g><g><circle cx="330" cy="670" r="15" fill="#f0c74f" stroke="#fff" stroke-width="3"/><text x="330" y="640" fill="#eee6cf" text-anchor="middle" font-family="Consolas, monospace" font-size="22" font-weight="800">LOS ANGELES</text><text x="330" y="712" fill="#98a5a3" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18">Reubens / Elfman</text></g><g><circle cx="930" cy="400" r="15" fill="#e54b4b" stroke="#fff" stroke-width="3"/><text x="930" y="370" fill="#eee6cf" text-anchor="middle" font-family="Consolas, monospace" font-size="22" font-weight="800">LONDON</text><text x="930" y="442" fill="#98a5a3" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18">Eno / Bowie / XTC</text></g><g><circle cx="1130" cy="520" r="15" fill="#f0c74f" stroke="#fff" stroke-width="3"/><text x="1130" y="490" fill="#eee6cf" text-anchor="middle" font-family="Consolas, monospace" font-size="22" font-weight="800">WOLPERATH</text><text x="1130" y="562" fill="#98a5a3" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18">Conny Plank studio</text></g><g><circle cx="1010" cy="670" r="15" fill="#e54b4b" stroke="#fff" stroke-width="3"/><text x="1010" y="640" fill="#eee6cf" text-anchor="middle" font-family="Consolas, monospace" font-size="22" font-weight="800">MUNICH</text><text x="1010" y="712" fill="#98a5a3" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18">Moroder</text></g>
  <g fill="none" stroke-width="5">
    <path d="M895 415C700 300 530 310 300 410" stroke="#168eaa" marker-end="url(#arrow-blue)"/>
    <path d="M210 520C500 435 760 450 1095 510" stroke="#e54b4b" stroke-dasharray="16 10" marker-end="url(#arrow-red)"/>
    <path d="M990 650C760 755 555 730 360 675" stroke="#168eaa" marker-end="url(#arrow-blue)"/>
    <path d="M355 645C575 555 760 560 970 640" stroke="#e54b4b" stroke-dasharray="16 10" marker-end="url(#arrow-red)"/>
