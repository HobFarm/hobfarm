<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-label="A flat map connects London, New York, Akron, Los Angeles, Wolperath and Munich with labeled project and cultural exchange arrows.">
  <defs>
    <pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#eee6cf"/>
      <path d="M0 5H24M0 17H24" stroke="#b9af96" stroke-width="0.6" opacity="0.23"/>
      <circle cx="4" cy="12" r="0.8" fill="#7c7463" opacity="0.18"/>
      <circle cx="19" cy="3" r="0.6" fill="#7c7463" opacity="0.15"/>
    </pattern>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#9eaaab" stroke-width="1" opacity="0.12"/>
    </pattern>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#e54b4b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#168eaa"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="9" dy="11" stdDeviation="0" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1400" height="900" fill="#080d10"/>
  <rect width="1400" height="900" fill="url(#grid)"/>
  
    <text x="70" y="74" fill="#e54b4b" font-family="Consolas, monospace" font-size="19" font-weight="700" letter-spacing="3">GEOGRAPHY AS FEEDBACK</text>
    <text x="70" y="126" fill="#eee6cf" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="800">THE ATLANTIC KEEPS SENDING THE SIGNAL BACK</text>
    <text x="70" y="163" fill="#aeb8b5" font-family="Arial, Helvetica, sans-serif" font-size="21">The projects move both ways. The arrows name the actual vehicle.</text>
    <path d="M70 188H1330" stroke="#f0c74f" stroke-width="5"/>
