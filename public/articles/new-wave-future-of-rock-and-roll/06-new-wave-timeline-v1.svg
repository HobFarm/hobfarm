<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1500" viewBox="0 0 1400 1500" role="img" aria-label="A timeline from 1973 to 2013 places the 1981 Nice Dreams scene among milestones involving Eno, Moroder, XTC, Peter Gabriel, King Crimson, Japan, MTV, Pee-wee, Primus and Daft Punk.">
  <defs>
    <pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#eee6cf"/>
      <path d="M0 5H24M0 17H24" stroke="#b9af96" stroke-width="0.6" opacity="0.23"/>
      <circle cx="4" cy="12" r="0.8" fill="#7c7463" opacity="0.18"/>
      <circle cx="19" cy="3" r="0.6" fill="#7c7463" opacity="0.15"/>
    </pattern>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#9eaaab" stroke-width="1" opacity="0.12"/>
    </pattern>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#e54b4b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#168eaa"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="9" dy="11" stdDeviation="0" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1400" height="1500" fill="#080d10"/>
  <rect width="1400" height="1500" fill="url(#grid)"/>
  
    <text x="70" y="74" fill="#e54b4b" font-family="Consolas, monospace" font-size="19" font-weight="700" letter-spacing="3">1973-2013</text>
    <text x="70" y="126" fill="#eee6cf" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="800">THE FUTURE ARRIVES IN PIECES</text>
    <text x="70" y="163" fill="#aeb8b5" font-family="Arial, Helvetica, sans-serif" font-size="21">Howie's 1981 speech lands after the experiments begin and before they become ordinary.</text>
    <path d="M70 188H1330" stroke="#f0c74f" stroke-width="5"/>
  <path d="M268 250V1385" stroke="#eee6cf" stroke-width="7"/>
  <g><circle cx="268" cy="260" r="15" fill="#f0c74f" stroke="#fff" stroke-width="3"/><text x="220" y="269" fill="#eee6cf" text-anchor="end" font-family="Consolas, monospace" font-size="25" font-weight="800">1973</text><rect x="320" y="227" width="970" height="66" rx="7" fill="#11181b" stroke="#2e3b3f" stroke-width="2"/><text x="348" y="267" fill="#bcc5c2" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500">Fripp and Eno release (No Pussyfooting). Cheech &amp; Chong headline a New Jersey bill with Springsteen.</text></g><g><circle cx="268" cy="338" r="15" fill="#168eaa" stroke="#fff" stroke-width="3"/><text x="220" y="347" fill="#eee6cf" text-anchor="end" font-family="Consolas, monospace" font-size="25" font-weight="800">1977</text><rect x="320" y="305" width="970" height="66" rx="7" fill="#11181b" stroke="#2e3b3f" stroke-width="2"/><text x="348" y="345" fill="#bcc5c2" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500">Bowie's Low and Heroes period. Donna Summer and Moroder release I Feel Love.</text></g><g><circle cx="268" cy="416" r="15" fill="#f0c74f" stroke="#fff" stroke-width="3"/><text x="220" y="425" fill="#eee6cf" text-anchor="end" font-family="Consolas, monospace" font-size="25" font-weight="800">1978</text><rect x="320" y="383" width="970" height="66" rx="7" fill="#11181b" stroke="#2e3b3f" stroke-width="2"/><text x="348" y="423" fill="#bcc5c2" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500">Eno produces Talking Heads and Devo projects.</text></g><g><circle cx="268" cy="494" r="15" fill="#168eaa" stroke="#fff" stroke-width="3"/><text x="220" y="503" fill="#eee6cf" text-anchor="end" font-family="Consolas, monospace" font-size="25" font-weight="800">1979</text><rect x="320" y="461" width="970" height="66" rx="7" fill="#11181b" stroke="#2e3b3f" stroke-width="2"/><text x="348" y="501" fill="#bcc5c2" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500">Drums and Wires. Life in Tokyo. Quiet Life.</text></g><g><circle cx="268" cy="572" r="15" fill="#f0c74f" stroke="#fff" stroke-width="3"/><text x="220" y="581" fill="#eee6cf" text-anchor="end" font-family="Consolas, monospace" font-size="25" font-weight="800">1980</text><rect x="320" y="539" width="970" height="66" rx="7" fill="#11181b" stroke="#2e3b3f" stroke-width="2"/><text x="348" y="579" fill="#bcc5c2" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500">Peter Gabriel 3. Remain in Light. Cheech &amp; Chong's Next Movie.</text></g><g><circle cx="268" cy="650" r="24" fill="#e54b4b" stroke="#fff" stroke-width="3"/><text x="220" y="659" fill="#e54b4b" text-anchor="end" font-family="Consolas, monospace" font-size="31" font-weight="800">1981</text><rect x="320" y="617" width="970" height="66" rx="7" fill="#251318" stroke="#e54b4b" stroke-width="4"/><text x="348" y="657" fill="#fff0df" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800">Nice Dreams. Discipline. Tin Drum. MTV. My Life in the Bush of Ghosts.</text></g><g><circle cx="268" cy="728" r="15" fill="#f0c74f" stroke="#fff" stroke-width="3"/><text x="220" y="737" fill="#eee6cf" text-anchor="end" font-family="Consolas, monospace" font-size="25" font-weight="800">1982</text><rect x="320" y="695" width="970" height="66" rx="7" fill="#11181b" stroke="#2e3b3f" stroke-width="2"/><text x="348" y="735" fill="#bcc5c2" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500">Beat. Peter Gabriel 4. Cat People.</text></g><g><circle cx="268" cy="806" r="15" fill="#168eaa" stroke="#fff" stroke-width="3"/><text x="220" y="815" fill="#eee6cf" text-anchor="end" font-family="Consolas, monospace" font-size="25" font-weight="800">1984</text><rect x="320" y="773" width="970" height="66" rx="7" fill="#11181b" stroke="#2e3b3f" stroke-width="2"/><text x="348" y="813" fill="#bcc5c2" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500">Three of a Perfect Pair. The NeverEnding Story.</text></g><g><circle cx="268" cy="884" r="15" fill="#f0c74f" stroke="#fff" stroke-width="3"/><text x="220" y="893" fill="#eee6cf" text-anchor="end" font-family="Consolas, monospace" font-size="25" font-weight="800">1985</text><rect x="320" y="851" width="970" height="66" rx="7" fill="#11181b" stroke="#2e3b3f" stroke-width="2"/><text x="348" y="891" fill="#bcc5c2" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500">Pee-wee's Big Adventure. Danny Elfman's score.</text></g><g><circle cx="268" cy="962" r="15" fill="#168eaa" stroke="#fff" stroke-width="3"/><text x="220" y="971" fill="#eee6cf" text-anchor="end" font-family="Consolas, monospace" font-size="25" font-weight="800">1986</text><rect x="320" y="929" width="970" height="66" rx="7" fill="#11181b" stroke="#2e3b3f" stroke-width="2"/><text x="348" y="969" fill="#bcc5c2" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500">Pee-wee's Playhouse. Mark Mothersbaugh's music.</text></g><g><circle cx="268" cy="1040" r="15" fill="#f0c74f" stroke="#fff" stroke-width="3"/><text x="220" y="1049" fill="#eee6cf" text-anchor="end" font-family="Consolas, monospace" font-size="25" font-weight="800">1992</text><rect x="320" y="1007" width="970" height="66" rx="7" fill="#11181b" stroke="#2e3b3f" stroke-width="2"/><text x="348" y="1047" fill="#bcc5c2" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500">Primus releases Miscellaneous Debris.</text></g><g><circle cx="268" cy="1118" r="15" fill="#168eaa" stroke="#fff" stroke-width="3"/><text x="220" y="1127" fill="#eee6cf" text-anchor="end" font-family="Consolas, monospace" font-size="25" font-weight="800">1993</text><rect x="320" y="1085" width="970" height="66" rx="7" fill="#11181b" stroke="#2e3b3f" stroke-width="2"/><text x="348" y="1125" fill="#bcc5c2" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500">Primus releases Hamburger Train on Pork Soda, opening with the Nice Dreams scene.</text></g><g><circle cx="268" cy="1196" r="15" fill="#f0c74f" stroke="#fff" stroke-width="3"/><text x="220" y="1205" fill="#eee6cf" text-anchor="end" font-family="Consolas, monospace" font-size="25" font-weight="800">1998</text><rect x="320" y="1163" width="970" height="66" rx="7" fill="#11181b" stroke="#2e3b3f" stroke-width="2"/><text x="348" y="1203" fill="#bcc5c2" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500">Primus releases Rhinoplasty.</text></g><g><circle cx="268" cy="1274" r="15" fill="#168eaa" stroke="#fff" stroke-width="3"/><text x="220" y="1283" fill="#eee6cf" text-anchor="end" font-family="Consolas, monospace" font-size="25" font-weight="800">2013</text><rect x="320" y="1241" width="970" height="66" rx="7" fill="#11181b" stroke="#2e3b3f" stroke-width="2"/><text x="348" y="1281" fill="#bcc5c2" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500">Daft Punk releases Giorgio by Moroder.</text></g>
  <g transform="translate(840 1327) rotate(-2)" filter="url(#shadow)">
    <rect width="450" height="95" fill="#e54b4b"/>
    <text x="225" y="40" fill="#fff6e3" text-anchor="middle" font-family="Consolas, monospace" font-size="18">THE FUTURE ARRIVED.</text>
    <text x="225" y="72" fill="#fff6e3" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="900">SPRINGSTEEN WAS STILL IN IT.</text>
  </g>
</svg>