<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1500 850"><title id="title">The layers of the creative AI market</title><desc id="desc">Stacked layers show model labs, first-party studios, aggregators, wrappers, specialized systems, hosted nodes, local and custom systems, and final assembly.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#171512"/></marker></defs><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#171512}.label{font-size:20px;font-weight:700;letter-spacing:.4px}.small{font-size:14px}.tiny{font-size:12px}.box{fill:#f1e8d3;stroke:#171512;stroke-width:3}.accent{fill:#d9e3e6;stroke:#171512;stroke-width:3}.warn{fill:#e8a065;stroke:#171512;stroke-width:3}.good{fill:#c7d8bb;stroke:#171512;stroke-width:3}.muted{fill:#d8d2c8;stroke:#171512;stroke-width:2}.line{stroke:#171512;stroke-width:4;fill:none;marker-end:url(#arrow)}.dash{stroke:#171512;stroke-width:2;fill:none;stroke-dasharray:8 6}.title{font-size:32px;font-weight:800}.subtitle{font-size:16px}.note{font-size:13px;font-style:italic}.badge{font-size:12px;font-weight:700}</style><rect width="100%" height="100%" fill="#fbf7ed"/><text x="60" y="55" class="title">THE MARKET LAYERS</text><text x="60" y="82" class="subtitle">Companies can occupy more than one layer. Online arguments often compare different layers as if they were one product.</text><rect x="80" y="150" width="1120" height="64" rx="12" class="warn"/><text x="98" y="177" class="label">MODEL LABS</text><text x="98" y="200" class="small">BFL, Google, OpenAI, Alibaba, ByteDance, Kling, MiniMax, Z.ai, xAI, Recraft, Ideogram, Stability, Pika, PixVerse, Vidu</text><rect x="230" y="228" width="1005" height="64" rx="12" class="accent"/><text x="248" y="255" class="label">FIRST-PARTY STUDIOS &amp; APIS</text><text x="248" y="278" class="small">AI Studio, Model Studio, BFL API, Kling, Luma API, OpenAI API</text><rect x="380" y="306" width="890" height="64" rx="12" class="box"/><text x="398" y="333" class="label">AGGREGATORS &amp; ROUTERS</text><text x="398" y="356" class="small">fal, Replicate, Hugging Face, OpenRouter, AI Gateway</text><rect x="530" y="384" width="775" height="64" rx="12" class="accent"/><text x="548" y="411" class="label">CREATIVE WRAPPERS</text><text x="548" y="434" class="small">Higgsfield, Runway, FLORA, Luma App, Krea, Magnific, Firefly, Leonardo, OpenArt</text><rect x="680" y="462" width="660" height="64" rx="12" class="box"/><text x="698" y="489" class="label">SPECIALIZED SYSTEMS</text><text x="698" y="512" class="small">ElevenLabs, HeyGen, Synthesia, InVideo</text><rect x="830" y="540" width="545" height="64" rx="12" class="warn"/><text x="848" y="567" class="label">HOSTED NODES &amp; GPU</text><text x="848" y="590" class="small">RunningHub, RunPod, fal Serverless</text><rect x="980" y="618" width="430" height="64" rx="12" class="good"/><text x="998" y="645" class="label">LOCAL &amp; CUSTOM</text><text x="998" y="668" class="small">ComfyUI, open weights, StyleFusion, provider adapters</text><rect x="1130" y="696" width="315" height="64" rx="12" class="muted"/><text x="1148" y="723" class="label">FINAL ASSEMBLY</text><text x="1148" y="746" class="small">editor, deterministic renderer, published article or film</text><path d="M 50 150 L 50 760" class="line"/><text x="18" y="455" class="small" transform="rotate(-90 18 455)">MORE USER CONTROL, MORE USER LABOR</text></svg>