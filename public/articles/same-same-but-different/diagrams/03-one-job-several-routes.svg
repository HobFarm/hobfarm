<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1900 560"><title id="title">One job can take several routes</title><desc id="desc">A source package branches to a first-party API, aggregator, creative wrapper, hosted graph, or local execution, each with different value and cost.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#171512"/></marker></defs><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#171512}.label{font-size:20px;font-weight:700;letter-spacing:.4px}.small{font-size:14px}.tiny{font-size:12px}.box{fill:#f1e8d3;stroke:#171512;stroke-width:3}.accent{fill:#d9e3e6;stroke:#171512;stroke-width:3}.warn{fill:#e8a065;stroke:#171512;stroke-width:3}.good{fill:#c7d8bb;stroke:#171512;stroke-width:3}.muted{fill:#d8d2c8;stroke:#171512;stroke-width:2}.line{stroke:#171512;stroke-width:4;fill:none;marker-end:url(#arrow)}.dash{stroke:#171512;stroke-width:2;fill:none;stroke-dasharray:8 6}.title{font-size:32px;font-weight:800}.subtitle{font-size:16px}.note{font-size:13px;font-style:italic}.badge{font-size:12px;font-weight:700}</style><rect width="100%" height="100%" fill="#fbf7ed"/><text x="55" y="55" class="title">ONE JOB, SEVERAL ROUTES</text><text x="55" y="82" class="subtitle">The source package can travel through different commercial arrangements.</text><rect x="55" y="270" width="250" height="150" rx="16" class="good"/><text x="78" y="310" class="label">SOURCE PACKAGE</text><text x="78" y="342" class="small">references + schema</text><text x="78" y="366" class="small">rules + acceptance test</text><text x="78" y="397" class="small">same job</text><path d="M 305 345 C 350 345, 340 255, 390 255" class="line"/><rect x="390" y="185" width="255" height="140" rx="14" class="accent"/><text x="406" y="217" class="label">FIRST-PARTY API</text><text x="406" y="250" class="small">VALUE: cleaner model relationship</text><text x="406" y="277" class="small">COST: integration, provider rules</text><rect x="406" y="293" width="150" height="20" rx="4" fill="#fbf7ed" stroke="#171512"/><text x="414" y="308" class="tiny">CHOOSE BY JOB</text><path d="M 305 345 C 350 345, 340 425, 690 425" class="line"/><rect x="690" y="355" width="255" height="140" rx="14" class="box"/><text x="706" y="387" class="label">AGGREGATOR</text><text x="706" y="420" class="small">VALUE: one account, many models</text><text x="706" y="447" class="small">COST: markup, endpoint variation</text><rect x="706" y="463" width="150" height="20" rx="4" fill="#fbf7ed" stroke="#171512"/><text x="714" y="478" class="tiny">CHOOSE BY JOB</text><path d="M 305 345 C 350 345, 340 255, 990 255" class="line"/><rect x="990" y="185" width="255" height="140" rx="14" class="warn"/><text x="1006" y="217" class="label">CREATIVE WRAPPER</text><text x="1006" y="250" class="small">VALUE: controls and project convenience</text><text x="1006" y="277" class="small">COST: credits, lock-in, extra policy</text><rect x="1006" y="293" width="150" height="20" rx="4" fill="#fbf7ed" stroke="#171512"/><text x="1014" y="308" class="tiny">CHOOSE BY JOB</text><path d="M 305 345 C 350 345, 340 425, 1290 425" class="line"/><rect x="1290" y="355" width="255" height="140" rx="14" class="accent"/><text x="1306" y="387" class="label">HOSTED GRAPH</text><text x="1306" y="420" class="small">VALUE: reusable nodes without owned GPU</text><text x="1306" y="447" class="small">COST: workflow and compute rent</text><rect x="1306" y="463" width="150" height="20" rx="4" fill="#fbf7ed" stroke="#171512"/><text x="1314" y="478" class="tiny">CHOOSE BY JOB</text><path d="M 305 345 C 350 345, 340 255, 1590 255" class="line"/><rect x="1590" y="185" width="255" height="140" rx="14" class="good"/><text x="1606" y="217" class="label">LOCAL EXECUTION</text><text x="1606" y="250" class="small">VALUE: weights, versions, fine-tunes</text><text x="1606" y="277" class="small">COST: hardware and maintenance</text><rect x="1606" y="293" width="150" height="20" rx="4" fill="#fbf7ed" stroke="#171512"/><text x="1614" y="308" class="tiny">CHOOSE BY JOB</text></svg>