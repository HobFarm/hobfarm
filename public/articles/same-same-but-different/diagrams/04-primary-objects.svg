<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1460 650"><title id="title">Primary objects of AI systems</title><desc id="desc">A card grid compares systems organized around requests, graphs, canvases, shots, video projects, voices, presenters, images, schema packages and compositions.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#171512"/></marker></defs><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#171512}.label{font-size:20px;font-weight:700;letter-spacing:.4px}.small{font-size:14px}.tiny{font-size:12px}.box{fill:#f1e8d3;stroke:#171512;stroke-width:3}.accent{fill:#d9e3e6;stroke:#171512;stroke-width:3}.warn{fill:#e8a065;stroke:#171512;stroke-width:3}.good{fill:#c7d8bb;stroke:#171512;stroke-width:3}.muted{fill:#d8d2c8;stroke:#171512;stroke-width:2}.line{stroke:#171512;stroke-width:4;fill:none;marker-end:url(#arrow)}.dash{stroke:#171512;stroke-width:2;fill:none;stroke-dasharray:8 6}.title{font-size:32px;font-weight:800}.subtitle{font-size:16px}.note{font-size:13px;font-style:italic}.badge{font-size:12px;font-weight:700}</style><rect width="100%" height="100%" fill="#fbf7ed"/><text x="55" y="55" class="title">WHAT THE SYSTEM ORGANIZES</text><text x="55" y="82" class="subtitle">Shared models do not make the products interchangeable.</text><rect x="55" y="125" width="310" height="125" rx="14" class="box"/><text x="71" y="155" class="label">REQUEST</text><text x="71" y="185" class="small">fal, direct API</text><text x="71" y="217" class="small">OPTIMIZES: programmability</text><rect x="405" y="125" width="310" height="125" rx="14" class="accent"/><text x="421" y="155" class="label">GRAPH</text><text x="421" y="185" class="small">ComfyUI</text><text x="421" y="217" class="small">OPTIMIZES: inspectability</text><rect x="755" y="125" width="310" height="125" rx="14" class="warn"/><text x="771" y="155" class="label">HOSTED GRAPH</text><text x="771" y="185" class="small">RunningHub</text><text x="771" y="217" class="small">OPTIMIZES: graph without GPU</text><rect x="1105" y="125" width="310" height="125" rx="14" class="good"/><text x="1121" y="155" class="label">CANVAS</text><text x="1121" y="185" class="small">FLORA, Spaces</text><text x="1121" y="217" class="small">OPTIMIZES: branching and team work</text><rect x="55" y="285" width="310" height="125" rx="14" class="accent"/><text x="71" y="315" class="label">SHOT</text><text x="71" y="345" class="small">Higgsfield</text><text x="71" y="377" class="small">OPTIMIZES: camera and iteration</text><rect x="405" y="285" width="310" height="125" rx="14" class="warn"/><text x="421" y="315" class="label">VIDEO PROJECT</text><text x="421" y="345" class="small">Runway</text><text x="421" y="377" class="small">OPTIMIZES: generation plus edit</text><rect x="755" y="285" width="310" height="125" rx="14" class="good"/><text x="771" y="315" class="label">AGENT PROJECT</text><text x="771" y="345" class="small">Luma</text><text x="771" y="377" class="small">OPTIMIZES: multi-step orchestration</text><rect x="1105" y="285" width="310" height="125" rx="14" class="box"/><text x="1121" y="315" class="label">VOICE</text><text x="1121" y="345" class="small">ElevenLabs</text><text x="1121" y="377" class="small">OPTIMIZES: audio performance</text><rect x="55" y="445" width="310" height="125" rx="14" class="warn"/><text x="71" y="475" class="label">PRESENTER</text><text x="71" y="505" class="small">HeyGen</text><text x="71" y="537" class="small">OPTIMIZES: reusable host</text><rect x="405" y="445" width="310" height="125" rx="14" class="good"/><text x="421" y="475" class="label">IMAGE / VECTOR</text><text x="421" y="505" class="small">Recraft, Ideogram</text><text x="421" y="537" class="small">OPTIMIZES: production visual</text><rect x="755" y="445" width="310" height="125" rx="14" class="box"/><text x="771" y="475" class="label">SCHEMA PACKAGE</text><text x="771" y="505" class="small">StyleFusion</text><text x="771" y="537" class="small">OPTIMIZES: portable intent</text><rect x="1105" y="445" width="310" height="125" rx="14" class="accent"/><text x="1121" y="475" class="label">COMPOSITION</text><text x="1121" y="505" class="small">HyperFrames</text><text x="1121" y="537" class="small">OPTIMIZES: deterministic output</text></svg>