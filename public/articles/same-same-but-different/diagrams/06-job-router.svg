<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1580 760"><title id="title">Job router for AI services</title><desc id="desc">A decision diagram starts with what are you making and routes to direct APIs, custom pipelines, canvases, graphs, video platforms, audio systems, avatars, design specialists, local control or final assembly.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#171512"/></marker></defs><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#171512}.label{font-size:20px;font-weight:700;letter-spacing:.4px}.small{font-size:14px}.tiny{font-size:12px}.box{fill:#f1e8d3;stroke:#171512;stroke-width:3}.accent{fill:#d9e3e6;stroke:#171512;stroke-width:3}.warn{fill:#e8a065;stroke:#171512;stroke-width:3}.good{fill:#c7d8bb;stroke:#171512;stroke-width:3}.muted{fill:#d8d2c8;stroke:#171512;stroke-width:2}.line{stroke:#171512;stroke-width:4;fill:none;marker-end:url(#arrow)}.dash{stroke:#171512;stroke-width:2;fill:none;stroke-dasharray:8 6}.title{font-size:32px;font-weight:800}.subtitle{font-size:16px}.note{font-size:13px;font-style:italic}.badge{font-size:12px;font-weight:700}</style><rect width="100%" height="100%" fill="#fbf7ed"/><text x="55" y="55" class="title">THE JOB ROUTER</text><text x="55" y="82" class="subtitle">The first answer to “what should I use?” is another question.</text><rect x="570" y="115" width="420" height="100" rx="20" class="warn"/><text x="780" y="160" text-anchor="middle" class="title">WHAT ARE YOU MAKING?</text><text x="780" y="188" text-anchor="middle" class="small">define output, budget, control and unacceptable failure</text><path d="M 780 215 C 780 250, 210 250, 210 300" class="dash"/><rect x="55" y="300" width="310" height="105" rx="14" class="box"/><text x="71" y="332" class="label">RAW MODEL ACCESS</text><text x="71" y="368" class="small">ROUTE: direct API / aggregator</text><path d="M 780 215 C 780 250, 590 250, 590 300" class="dash"/><rect x="435" y="300" width="310" height="105" rx="14" class="accent"/><text x="451" y="332" class="label">CUSTOM PIPELINE</text><text x="451" y="368" class="small">ROUTE: schema + adapters</text><path d="M 780 215 C 780 250, 970 250, 970 300" class="dash"/><rect x="815" y="300" width="310" height="105" rx="14" class="good"/><text x="831" y="332" class="label">VISUAL EXPLORATION</text><text x="831" y="368" class="small">ROUTE: canvas platform</text><path d="M 780 215 C 780 250, 1350 250, 1350 300" class="dash"/><rect x="1195" y="300" width="310" height="105" rx="14" class="warn"/><text x="1211" y="332" class="label">REUSABLE GRAPH</text><text x="1211" y="368" class="small">ROUTE: ComfyUI / hosted nodes</text><path d="M 780 215 C 780 250, 210 250, 210 455" class="dash"/><rect x="55" y="455" width="310" height="105" rx="14" class="box"/><text x="71" y="487" class="label">SHORT VIDEO</text><text x="71" y="523" class="small">ROUTE: best accepted-second cost</text><path d="M 780 215 C 780 250, 590 250, 590 455" class="dash"/><rect x="435" y="455" width="310" height="105" rx="14" class="accent"/><text x="451" y="487" class="label">CINEMATIC SHOT</text><text x="451" y="523" class="small">ROUTE: camera/keyframe platform</text><path d="M 780 215 C 780 250, 970 250, 970 455" class="dash"/><rect x="815" y="455" width="310" height="105" rx="14" class="good"/><text x="831" y="487" class="label">AUDIO PACKAGE</text><text x="831" y="523" class="small">ROUTE: audio specialist</text><path d="M 780 215 C 780 250, 1350 250, 1350 455" class="dash"/><rect x="1195" y="455" width="310" height="105" rx="14" class="warn"/><text x="1211" y="487" class="label">PRESENTER</text><text x="1211" y="523" class="small">ROUTE: avatar specialist</text><path d="M 780 215 C 780 250, 400 250, 400 610" class="dash"/><rect x="245" y="610" width="310" height="105" rx="14" class="box"/><text x="261" y="642" class="label">DESIGN ASSET</text><text x="261" y="678" class="small">ROUTE: image/vector specialist</text><path d="M 780 215 C 780 250, 780 250, 780 610" class="dash"/><rect x="625" y="610" width="310" height="105" rx="14" class="accent"/><text x="641" y="642" class="label">LOCAL CONTROL</text><text x="641" y="678" class="small">ROUTE: owned or rented GPU</text><path d="M 780 215 C 780 250, 1160 250, 1160 610" class="dash"/><rect x="1005" y="610" width="310" height="105" rx="14" class="good"/><text x="1021" y="642" class="label">FINAL ASSEMBLY</text><text x="1021" y="678" class="small">ROUTE: editor / deterministic renderer</text></svg>