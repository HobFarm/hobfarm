<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 2380 330"><title id="title">The whole AI production machine</title><desc id="desc">A ten-stage flow from source material through interpretation, adapters, endpoints, wrappers, moderation, billing, retries and an accepted asset.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#171512"/></marker></defs><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#171512}.label{font-size:20px;font-weight:700;letter-spacing:.4px}.small{font-size:14px}.tiny{font-size:12px}.box{fill:#f1e8d3;stroke:#171512;stroke-width:3}.accent{fill:#d9e3e6;stroke:#171512;stroke-width:3}.warn{fill:#e8a065;stroke:#171512;stroke-width:3}.good{fill:#c7d8bb;stroke:#171512;stroke-width:3}.muted{fill:#d8d2c8;stroke:#171512;stroke-width:2}.line{stroke:#171512;stroke-width:4;fill:none;marker-end:url(#arrow)}.dash{stroke:#171512;stroke-width:2;fill:none;stroke-dasharray:8 6}.title{font-size:32px;font-weight:800}.subtitle{font-size:16px}.note{font-size:13px;font-style:italic}.badge{font-size:12px;font-weight:700}</style><rect width="100%" height="100%" fill="#fbf7ed"/><text x="50" y="55" class="title">THE WHOLE MACHINE</text><text x="50" y="82" class="subtitle">Every layer can change the result before it reaches the project.</text><rect x="35" y="130" width="210" height="105" rx="12" class="box"/><text x="49" y="160" class="label">SOURCE MATERIAL</text><text x="49" y="187" class="small">references, notes, audio</text><text x="49" y="205" class="small">code, rules</text><rect x="47" y="212" width="186" height="18" rx="5" fill="#fbf7ed" stroke="#171512" stroke-width="1"/><text x="55" y="226" class="tiny">CAN FAIL: missing context</text><path d="M 245 182.5 L 263 182.5" class="line"/><rect x="267" y="130" width="210" height="105" rx="12" class="accent"/><text x="281" y="160" class="label">INTERPRETER</text><text x="281" y="187" class="small">what the system notices</text><rect x="279" y="212" width="186" height="18" rx="5" fill="#fbf7ed" stroke="#171512" stroke-width="1"/><text x="287" y="226" class="tiny">CAN FAIL: wrong emphasis</text><path d="M 477 182.5 L 495 182.5" class="line"/><rect x="499" y="130" width="210" height="105" rx="12" class="accent"/><text x="513" y="160" class="label">SCHEMA OR PROMPT</text><text x="513" y="187" class="small">what survives compression</text><rect x="511" y="212" width="186" height="18" rx="5" fill="#fbf7ed" stroke="#171512" stroke-width="1"/><text x="519" y="226" class="tiny">CAN FAIL: detail dropped</text><path d="M 709 182.5 L 727 182.5" class="line"/><rect x="731" y="130" width="210" height="105" rx="12" class="warn"/><text x="745" y="160" class="label">PROVIDER ADAPTER</text><text x="745" y="187" class="small">limits, fields, file formats</text><rect x="743" y="212" width="186" height="18" rx="5" fill="#fbf7ed" stroke="#171512" stroke-width="1"/><text x="751" y="226" class="tiny">CAN FAIL: prompt too long</text><path d="M 941 182.5 L 959 182.5" class="line"/><rect x="963" y="130" width="210" height="105" rx="12" class="accent"/><text x="977" y="160" class="label">ENDPOINT</text><text x="977" y="187" class="small">version, route, settings</text><rect x="975" y="212" width="186" height="18" rx="5" fill="#fbf7ed" stroke="#171512" stroke-width="1"/><text x="983" y="226" class="tiny">CAN FAIL: wrong variant</text><path d="M 1173 182.5 L 1191 182.5" class="line"/><rect x="1195" y="130" width="210" height="105" rx="12" class="accent"/><text x="1209" y="160" class="label">WRAPPER</text><text x="1209" y="187" class="small">controls, project state</text><rect x="1207" y="212" width="186" height="18" rx="5" fill="#fbf7ed" stroke="#171512" stroke-width="1"/><text x="1215" y="226" class="tiny">CAN FAIL: hidden rewrite</text><path d="M 1405 182.5 L 1423 182.5" class="line"/><rect x="1427" y="130" width="210" height="105" rx="12" class="warn"/><text x="1441" y="160" class="label">MODERATION</text><text x="1441" y="187" class="small">input and output gates</text><rect x="1439" y="212" width="186" height="18" rx="5" fill="#fbf7ed" stroke="#171512" stroke-width="1"/><text x="1447" y="226" class="tiny">CAN FAIL: false positive</text><path d="M 1637 182.5 L 1655 182.5" class="line"/><rect x="1659" y="130" width="210" height="105" rx="12" class="warn"/><text x="1673" y="160" class="label">BILLING &amp; LIMITS</text><text x="1673" y="187" class="small">credits, queue, rate, region</text><rect x="1671" y="212" width="186" height="18" rx="5" fill="#fbf7ed" stroke="#171512" stroke-width="1"/><text x="1679" y="226" class="tiny">CAN FAIL: out of usage</text><path d="M 1869 182.5 L 1887 182.5" class="line"/><rect x="1891" y="130" width="210" height="105" rx="12" class="warn"/><text x="1905" y="160" class="label">RETRY LOOP</text><text x="1905" y="187" class="small">human labor</text><rect x="1903" y="212" width="186" height="18" rx="5" fill="#fbf7ed" stroke="#171512" stroke-width="1"/><text x="1911" y="226" class="tiny">CAN FAIL: time disappears</text><path d="M 2101 182.5 L 2119 182.5" class="line"/><rect x="2123" y="130" width="210" height="105" rx="12" class="good"/><text x="2137" y="160" class="label">ACCEPTED ASSET</text><text x="2137" y="187" class="small">what enters the project</text><rect x="2135" y="212" width="186" height="18" rx="5" fill="#fbf7ed" stroke="#171512" stroke-width="1"/><text x="2143" y="226" class="tiny">PASSED: useful enough</text><text x="50" y="285" class="note">A model benchmark usually examines one box. A production system has to survive all ten.</text></svg>