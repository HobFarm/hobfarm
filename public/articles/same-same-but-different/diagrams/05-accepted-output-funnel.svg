<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1510 720"><title id="title">Accepted output funnel</title><desc id="desc">An illustrative funnel shrinks twenty submitted attempts to one published result, beside formulas for acceptance rate and cost per accepted output.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#171512"/></marker></defs><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#171512}.label{font-size:20px;font-weight:700;letter-spacing:.4px}.small{font-size:14px}.tiny{font-size:12px}.box{fill:#f1e8d3;stroke:#171512;stroke-width:3}.accent{fill:#d9e3e6;stroke:#171512;stroke-width:3}.warn{fill:#e8a065;stroke:#171512;stroke-width:3}.good{fill:#c7d8bb;stroke:#171512;stroke-width:3}.muted{fill:#d8d2c8;stroke:#171512;stroke-width:2}.line{stroke:#171512;stroke-width:4;fill:none;marker-end:url(#arrow)}.dash{stroke:#171512;stroke-width:2;fill:none;stroke-dasharray:8 6}.title{font-size:32px;font-weight:800}.subtitle{font-size:16px}.note{font-size:13px;font-style:italic}.badge{font-size:12px;font-weight:700}</style><rect width="100%" height="100%" fill="#fbf7ed"/><text x="55" y="55" class="title">THE ACCEPTED-OUTPUT FUNNEL</text><text x="55" y="82" class="subtitle">Illustrative. Replace with a real production audit when available.</text><polygon points="70.0,125 970.0,125 925.0,187 115.0,187" class="warn"/><text x="520" y="152" text-anchor="middle" class="label">20 SUBMITTED</text><polygon points="127.5,203 912.5,203 867.5,265 172.5,265" class="warn"/><text x="520" y="230" text-anchor="middle" class="label">17 COMPLETED</text><polygon points="185.0,281 855.0,281 810.0,343 230.0,343" class="warn"/><text x="520" y="308" text-anchor="middle" class="label">9 LOOKED IMPRESSIVE</text><polygon points="242.5,359 797.5,359 752.5,421 287.5,421" class="accent"/><text x="520" y="386" text-anchor="middle" class="label">5 FOLLOWED BRIEF</text><polygon points="300.0,437 740.0,437 695.0,499 345.0,499" class="accent"/><text x="520" y="464" text-anchor="middle" class="label">3 PRESERVED CONTINUITY</text><polygon points="357.5,515 682.5,515 637.5,577 402.5,577" class="accent"/><text x="520" y="542" text-anchor="middle" class="label">2 SURVIVED EDIT</text><polygon points="415.0,593 625.0,593 580.0,655 460.0,655" class="good"/><text x="520" y="620" text-anchor="middle" class="label">1 PUBLISHED</text><rect x="1080" y="155" width="360" height="110" rx="14" class="box"/><text x="1100" y="188" class="label">ACCEPTANCE RATE</text><text x="1100" y="225" class="small">accepted outputs / attempts</text><rect x="1080" y="295" width="360" height="110" rx="14" class="box"/><text x="1100" y="328" class="label">COST PER ACCEPTED</text><text x="1100" y="365" class="small">total spend / accepted assets</text><rect x="1080" y="435" width="360" height="110" rx="14" class="box"/><text x="1100" y="468" class="label">COST PER USABLE SECOND</text><text x="1100" y="505" class="small">video spend / final seconds</text></svg>