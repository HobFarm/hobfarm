# .pages.yml — Pages CMS config for HobFarm

media:
  name: images
  label: Images
  input: src/images
  output: src/images
  path: ""
  extensions: [png, jpg, jpeg, webp, svg]

settings:
  content:
    merge: true

content:
  # ---------------------
  # ARTICLES
  # ---------------------
  - name: articles
    label: Articles
    type: collection
    path: src/content/articles
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title, category, publishedAt]
      sort: [publishedAt]
      default:
        sort: publishedAt
        order: desc
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: excerpt, label: Excerpt, type: text, required: true }
      - { name: dek, label: Dek, type: text }
      - { name: description, label: SEO Description, type: text }
      - { name: author, label: Author, type: string }
      - name: category
        label: Category (legacy, use Department)
        type: select
        options: [technical, magazine-time-machine, cultural-thread, grimoire, stylefusion, hobbot, business, research]
      - name: department
        label: Department
        type: select
        options: [magazine-time-machine, wtfacts, satire, picture-stories, funnies, cute-corrupted, before-after-eras, critter-feed, hobfarm-presents, workshop-notes, essays-arguments]
      - name: format
        label: Format
        type: select
        options: [article, cartoon, wtf-card, satire-piece, picture-story, gallery-set, video, trailer, workshop-note, character-page, cover]
      - name: status
        label: Status
        type: select
        options: [draft, scheduled, published, archived]
      - { name: series, label: Series, type: string }
      - { name: presentsSeries, label: Presents Series, type: string }
      - name: workshopProgram
        label: Workshop Program
        type: select
        options: [before-and-after, alter-ego, cute-and-corrupted, character-mannequin, stylefusion, workshop-notes]
      - name: entryType
        label: Presents Entry Type
        type: select
        options: [feature, video-essay, article, short-investigation, scene-study, connection-map, archive-note]
      - name: video
        label: Self-hosted Video
        type: object
        fields:
          - { name: src, label: MP4 URL, type: string }
          - { name: hls, label: HLS URL, type: string }
          - { name: poster, label: Poster URL, type: string }
          - { name: captions, label: WebVTT Captions URL, type: string }
          - { name: duration, label: ISO 8601 Duration, type: string }
          - name: aspectRatio
            label: Aspect Ratio
            type: select
            options: ["16:9", "4:3", "9:16"]
      - name: connection
        label: 3DM Connection
        type: object
        fields:
          - { name: origin, label: Origin Subject, type: string }
          - { name: degreeCount, label: Degree Count, type: number }
          - name: chain
            label: Connection Chain
            type: object
            list: true
            fields:
              - { name: name, label: Name, type: string }
              - name: kind
                label: Kind
                type: select
                options: [person, film, production, company, studio, craftsperson, cultural-object]
              - { name: note, label: Connection Note, type: text }
              - { name: year, label: Year or Period, type: string }
              - { name: evidence, label: Evidence Note, type: text }
              - { name: source, label: Source URL, type: string }
      - { name: contentWarnings, label: Content Warnings, type: string, list: true }
      - { name: rightsNote, label: Rights and Sourcing Note, type: text }
      - name: sourceNotes
        label: Source Notes
        type: object
        list: true
        fields:
          - { name: label, label: Source Label, type: string }
          - { name: url, label: Source URL, type: string }
          - { name: note, label: Evidence Note, type: text }
          - name: type
            label: Evidence Type
            type: select
            options: [documented-fact, participant-recollection, trade-report, promotional-claim, historical-interpretation, open-question]
      - { name: tags, label: Tags, type: string, list: true }
      - { name: hero, label: Hero Image URL, type: string }
      - { name: heroImage, label: Hero Image URL (new field), type: string }
      - { name: heroAlt, label: Hero Alt Text, type: string }
      - { name: socialImage, label: Social Image URL, type: string }
      - { name: thumbnail, label: Thumbnail URL, type: string }
      - { name: socialCaption, label: Social Caption, type: text }
      - name: arrangement
        label: Article Hero Layout
        type: select
        options: [horizontal-hero, vertical-hero]
      - { name: canonical, label: Canonical URL, type: string }
      - { name: publishedAt, label: Published At, type: date, required: true }
      - { name: pubDate, label: Publication Date (new field), type: date }
      - { name: updatedDate, label: Updated Date, type: date }
      - { name: featured, label: Featured, type: boolean }
      - { name: coverStory, label: Cover Story, type: boolean }
      - { name: relatedArticles, label: Related Article Slugs, type: string, list: true }
      - { name: relatedGallery, label: Related Gallery URL, type: string }
      - { name: relatedProject, label: Related Project URL, type: string }
      - { name: relatedVideo, label: Related Video URL, type: string }
      - { name: relatedWorkshop, label: Related Workshop IDs, type: string, list: true }
      - { name: relatedAcademy, label: Related Academy IDs, type: string, list: true }
      - { name: relatedProducts, label: Related Product IDs, type: string, list: true }
      - { name: relatedCharacters, label: Related Character IDs, type: string, list: true }
      - { name: relatedVisualSystems, label: Related Visual System IDs, type: string, list: true }
      - name: workshopCTA
        label: Workshop CTA
        type: object
        fields:
          - { name: label, label: Label, type: string }
          - { name: href, label: Href, type: string }
      - name: academyCTA
        label: Academy CTA
        type: object
        fields:
          - { name: label, label: Label, type: string }
          - { name: href, label: Href, type: string }
      - name: supportCTA
        label: Support CTA
        type: object
        fields:
          - { name: label, label: Label, type: string }
          - { name: href, label: Href, type: string }
      - { name: draft, label: Draft, type: boolean }
      - { name: body, label: Body, type: rich-text }

  # ---------------------
  # ACADEMY LESSONS
  # ---------------------
  - name: academy
    label: Academy Lessons
    type: collection
    path: src/content/academy
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title, courseSlug, moduleTitle, order]
      sort: [courseSlug, order]
    fields:
      - { name: courseSlug, label: Course Slug, type: string, required: true }
      - { name: courseId, label: Stable Course ID, type: string }
      - { name: lessonId, label: Stable Lesson ID, type: string }
      - { name: slug, label: Lesson Slug, type: string, required: true }
      - { name: title, label: Title, type: string, required: true }
      - { name: deck, label: Deck, type: text, required: true }
      - { name: order, label: Lesson Order, type: number, required: true }
      - { name: moduleTitle, label: Module Title, type: string, required: true }
      - { name: moduleId, label: Stable Module ID, type: string }
      - { name: moduleOrder, label: Module Order, type: number, required: true }
      - { name: duration, label: Duration, type: string, required: true }
      - { name: skill, label: Skill, type: text, required: true }
      - { name: learnerOutput, label: Learner Output, type: string, required: true }
      - name: access
        label: Access
        type: select
        default: public
        options: [public, paid]
      - { name: objective, label: Objective, type: text }
      - { name: builds, label: Artifact Built, type: text }
      - { name: sourceRefs, label: Source References, type: string, list: true }
      - name: evidenceStatus
        label: Evidence Status
        type: select
        default: verified
        options: [verified, needs_operator, volatile]
      - { name: providerDetailDate, label: Provider Detail Date, type: date }
      - { name: exercise, label: Guided Exercise, type: text }
      - { name: checkpoint, label: Completion Checkpoint, type: text }
      - { name: nextLesson, label: Next Stable Lesson ID, type: string }
      - { name: prerequisites, label: Prerequisites, type: string, list: true }
      - { name: inputs, label: Inputs, type: string, list: true }
      - name: figure
        label: Primary Figure
        type: object
        fields:
          - { name: src, label: Image URL, type: string, required: true }
          - { name: alt, label: Alt Text, type: text, required: true }
          - { name: caption, label: Caption, type: text, required: true }
      - name: downloads
        label: Downloads
        type: object
        list: true
        fields:
          - { name: label, label: Label, type: string }
          - { name: href, label: URL, type: string }
          - { name: format, label: Format, type: string }
      - name: sourceNotes
        label: Source Notes
        type: object
        list: true
        fields:
          - { name: label, label: Label, type: string }
          - { name: url, label: URL, type: string }
          - { name: note, label: Evidence Note, type: text }
      - { name: fieldRule, label: Field Rule, type: text, required: true }
      - { name: commonDefault, label: Common Default, type: text, required: true }
      - { name: replacementMethod, label: Replacement Method, type: text, required: true }
      - { name: relatedArticle, label: Related Article URL, type: string }
      - { name: draft, label: Draft, type: boolean }
      - { name: body, label: Body, type: rich-text }

  # ---------------------
  # COMICS (Funnies)
  # ---------------------
  - name: comics
    label: Comics
    type: collection
    path: src/content/comics
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title, series, date, status]
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - { name: title, label: Title, type: string, required: true }
      - name: series
        label: Series
        type: select
        required: true
        options: [gary, gary-fat-cat, fat-cat, larry, buffcock, hobunny, gothcat, one-offs]
      - { name: characters, label: Characters, type: string, list: true }
      - name: department
        label: Department
        type: select
        options: [magazine-time-machine, wtfacts, satire, picture-stories, funnies, cute-corrupted, before-after-eras, critter-feed, hobfarm-presents, workshop-notes, essays-arguments]
      - name: format
        label: Format
        type: select
        options: [article, cartoon, wtf-card, satire-piece, picture-story, gallery-set, video, trailer, workshop-note, character-page, cover]
      - { name: image, label: Comic Image URL, type: string, required: true }
      - { name: imageAlt, label: Image Alt Text, type: string }
      - { name: caption, label: Caption / Premise, type: text }
      - { name: tags, label: Tags, type: string, list: true }
      - { name: date, label: Date, type: date, required: true }
      - { name: socialCaption, label: Social Caption, type: text }
      - name: status
        label: Status
        type: select
        options: [draft, scheduled, published, archived]
      - { name: draft, label: Draft, type: boolean }

  # ---------------------
  # PRODUCTS / DROPS
  # ---------------------
  - name: products
    label: Products / Drops
    type: collection
    path: src/content/products
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title, platform, status, featured]
      sort: [dropDate]
      default:
        sort: dropDate
        order: desc
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: sku, label: Canonical SKU, type: string }
      - name: platform
        label: Platform
        type: select
        required: true
        options: [deviantart, kofi, etsy, ebay, lemon-squeezy, hobfarm-direct]
      - { name: externalUrl, label: Storefront URL (leave blank until live), type: string }
      - { name: externalListingId, label: External Listing ID, type: string }
      - name: fulfillment
        label: Fulfillment
        type: select
        options: [external, lemon-squeezy, stripe-direct, printful, manual]
      - { name: printfulProductId, label: Printful Product ID, type: string }
      - name: variants
        label: Variants
        type: object
        list: true
        fields:
          - { name: code, label: Checkout Variant Code, type: string }
          - { name: sku, label: SKU, type: string, required: true }
          - { name: name, label: Name, type: string, required: true }
          - { name: unitAmount, label: Unit Price in Cents, type: number }
          - { name: priceLabel, label: Price Label, type: string }
          - { name: currency, label: Currency, type: string }
          - { name: printfulVariantId, label: Printful Variant ID, type: string }
          - name: previewImage
            label: Variant Preview Image
            type: object
            fields:
              - { name: folder, label: R2 Folder, type: string, required: true }
              - { name: file, label: Preview file, type: string, required: true }
              - { name: alt, label: Alt text, type: string, required: true }
          - { name: available, label: Available, type: boolean }
      - { name: entitlementId, label: Digital/Course Entitlement ID, type: string }
      - name: productType
        label: Product Type
        type: select
        options: [premium-sheet-pack, digital-download, print, pod, handmade, vintage, bundle]
      - name: previewImage
        label: Preview Image (web-size only)
        type: object
        required: true
        fields:
          - { name: folder, label: R2 Folder, type: string, required: true }
          - { name: file, label: Preview file, type: string, required: true }
          - { name: alt, label: Alt text, type: string, required: true }
      - { name: shortDescription, label: Short Description, type: text, required: true }
      - { name: includedItems, label: Included Items, type: string, list: true }
      - name: department
        label: Department
        type: select
        options: [magazine-time-machine, wtfacts, satire, picture-stories, funnies, cute-corrupted, before-after-eras, critter-feed, hobfarm-presents, workshop-notes, essays-arguments]
      - { name: visualSystem, label: Visual System id, type: string }
      - { name: relatedArticle, label: Related Article id, type: string }
      - { name: relatedWorkshopNote, label: Related Workshop Note id, type: string }
      - { name: relatedWorkshop, label: Related Workshop IDs, type: string, list: true }
      - { name: relatedAcademy, label: Related Academy IDs, type: string, list: true }
      - { name: relatedProducts, label: Related Product IDs, type: string, list: true }
      - { name: relatedArticles, label: Related Article IDs, type: string, list: true }
      - { name: relatedCharacters, label: Related Character IDs, type: string, list: true }
      - { name: relatedVisualSystems, label: Related Visual System IDs, type: string, list: true }
      - name: relatedContent
        label: Related Content
        type: object
        list: true
        fields:
          - { name: label, label: Label, type: string, required: true }
          - { name: href, label: URL, type: string, required: true }
      - { name: priceLabel, label: Price Label, type: string }
      - name: paidAssetPolicy
        label: Paid Asset Policy
        type: object
        fields:
          - { name: hasPaidAsset, label: Has paid full-res counterpart, type: boolean }
          - { name: publicPreviewOnly, label: Public preview only, type: boolean }
          - name: allowedPublicPreviewTypes
            label: Allowed public preview types
            type: select
            list: true
            options: [thumb, web-preview, poster, video-preview, crop]
          - { name: fullAssetHostedOnSite, label: Full asset hosted on site, type: boolean }
          - { name: notes, label: Notes, type: text }
      - name: status
        label: Status
        type: select
        options: [live, planned, coming-soon, sold-out, archived]
      - { name: dropDate, label: Drop Date, type: date }
      - { name: edition, label: Edition, type: string }
      - { name: licenseVersion, label: License Version, type: string }
      - name: licenseType
        label: License Type
        type: select
        options: [standard-non-exclusive, exclusive, custom]
      - { name: featured, label: Featured, type: boolean }
      - { name: body, label: Body, type: rich-text }

  # ---------------------
  # GALLERY
  # ---------------------
  - name: gallery
    label: Gallery
    type: collection
    path: src/content/gallery
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title, type, featured, draft]
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - { name: title, label: Title, type: string, required: true }
      - name: type
        label: Type
        type: select
        required: true
        options: [fashion, character-dev, before-and-after, cute-corrupted, compilation, scene, asset-lab, model-lab, video-workflow, premium-showcase]
      - name: department
        label: Department
        type: select
        options: [magazine-time-machine, wtfacts, satire, picture-stories, funnies, cute-corrupted, before-after-eras, critter-feed, hobfarm-presents, workshop-notes, essays-arguments]
      - name: workshopProgram
        label: Workshop Program
        type: select
        options: [before-and-after, alter-ego, cute-and-corrupted, character-mannequin, stylefusion, workshop-notes]
      - name: format
        label: Format
        type: select
        options: [article, cartoon, wtf-card, satire-piece, picture-story, gallery-set, video, trailer, workshop-note, character-page, cover]
      - { name: summary, label: Summary, type: text, required: true }
      - { name: folder, label: R2 Folder (e.g. gallery/fashion/glamour-pin-up), type: string, required: true }
      - name: hero
        label: Hero Media
        type: object
        required: true
        fields:
          - name: type
            label: Type
            type: select
            required: true
            options: [image, video]
          - { name: file, label: File (in folder), type: string, required: true }
          - { name: alt, label: Alt text, type: string, required: true }
          - { name: poster, label: Poster file (video only), type: string }
      - { name: date, label: Date, type: date }
      - { name: featured, label: Featured, type: boolean }
      - { name: draft, label: Draft, type: boolean }
      - { name: tags, label: Tags, type: string, list: true }
      - { name: series, label: Series, type: string }
      - { name: categories, label: Categories, type: string, list: true }
      - name: editorialMode
        label: Editorial Mode
        type: select
        options: [documentary-comparison, historical-reconstruction, speculative-restoration, counterfactual-history, fictional-character-transformation]
      - { name: beforeDate, label: Before Date or State, type: string }
      - { name: afterDate, label: After Date or State, type: string }
      - { name: location, label: Location, type: string }
      - { name: premise, label: Premise, type: text }
      - { name: beforeImage, label: Before Image, type: string }
      - { name: afterImage, label: After Image, type: string }
      - { name: video, label: Transformation Video, type: string }
      - { name: poster, label: Video Poster, type: string }
      - { name: historicalContext, label: Historical Context, type: text }
      - { name: alternatePremise, label: Alternate Premise, type: text }
      - name: sourceCredit
        label: Source Credit
        type: object
        fields:
          - { name: label, label: Label, type: string, required: true }
          - { name: url, label: Source URL, type: string }
          - { name: note, label: Source Note, type: text }
          - { name: license, label: License or Reuse Terms, type: string }
      - { name: toolCredit, label: Tool Credit, type: string }
      - { name: continuityNotes, label: Continuity Notes, type: text }
      - name: thumb
        label: Thumbnail Override
        type: object
        fields:
          - { name: file, label: File, type: string }
          - { name: alt, label: Alt text, type: string }
      - name: media
        label: Media Grid
        type: object
        list: true
        fields:
          - name: type
            label: Type
            type: select
            options: [image, video]
          - { name: file, label: File, type: string }
          - { name: alt, label: Alt text, type: string }
          - { name: caption, label: Caption, type: string }
          - name: role
            label: Role
            type: select
            options: [primary, reference, variant, failure, preview, process]
          - { name: provider, label: Provider, type: string }
          - { name: poster, label: Poster file (video only), type: string }
          - { name: paid, label: Paid original (disables full-size video lightbox), type: boolean }
          - { name: previewMaxWidth, label: Preview cap width (px, ≤1600), type: number }
      - { name: irFile, label: IR JSON file in folder, type: string }
      - name: infoModules
        label: Info Modules
        type: object
        list: true
        fields:
          - { name: label, label: Label, type: string }
          - { name: value, label: Value, type: string }
      - name: comparison
        label: Field Test Block (model-lab)
        type: object
        fields:
          - name: mode
            label: Mode
            type: select
            options: [image, text, multimodal, video]
          - { name: testedModels, label: Tested Models, type: string, list: true }
          - { name: promptSummary, label: Prompt Summary, type: text }
          - { name: findings, label: Findings, type: string, list: true }
          - { name: failureModes, label: Failure Modes, type: string, list: true }
          - { name: bestFor, label: Best For, type: string, list: true }
      - { name: processNotes, label: Process Notes, type: text }
      - name: externalLinks
        label: External Links
        type: object
        fields:
          - { name: deviantArt, label: DeviantArt URL, type: string }
          - { name: deviantArtPremium, label: DA Premium URL, type: string }
          - { name: kofi, label: Ko-fi URL, type: string }
          - { name: course, label: Course URL, type: string }
      - name: paidAssetPolicy
        label: Paid Asset Policy (preview-only safety)
        type: object
        fields:
          - { name: hasPaidAsset, label: Has paid full-res counterpart, type: boolean }
          - { name: publicPreviewOnly, label: Public preview only, type: boolean }
          - name: allowedPublicPreviewTypes
            label: Allowed public preview types
            type: select
            list: true
            options: [thumb, web-preview, poster, video-preview, crop]
          - { name: fullAssetHostedOnSite, label: Full asset hosted on site, type: boolean }
          - { name: notes, label: Notes, type: text }
      - { name: related, label: Related entry IDs (e.g. fashion/glamour-pin-up), type: string, list: true }
      - { name: relatedWorkshop, label: Related Workshop IDs, type: string, list: true }
      - { name: relatedAcademy, label: Related Academy IDs, type: string, list: true }
      - { name: relatedProducts, label: Related Product IDs, type: string, list: true }
      - { name: relatedArticles, label: Related Article IDs, type: string, list: true }
      - { name: relatedCharacters, label: Related Character IDs, type: string, list: true }
      - { name: relatedVisualSystems, label: Related Visual System IDs, type: string, list: true }
      - { name: methods, label: Methods (free-form labels), type: string, list: true }
      - { name: relatedProcess, label: Related Process (e.g. /process/fashion/), type: string }
      - name: concept
        label: Concept
        type: object
        fields:
          - { name: thesis, label: Thesis, type: text }
          - { name: method, label: Method Name, type: string }
          - { name: seedInputs, label: Seed Inputs, type: string, list: true }
          - { name: growthStages, label: Growth Stages, type: string, list: true }
          - { name: reusablePattern, label: Reusable Pattern, type: text }
          - { name: usefulFor, label: Useful For, type: string, list: true }
      - name: fieldNotes
        label: Field Notes
        type: object
        list: true
        fields:
          - { name: label, label: Label, type: string }
          - { name: text, label: Text, type: text }
      - name: visualDNA
        label: Visual DNA
        type: object
        list: true
        fields:
          - { name: label, label: Label, type: string }
          - { name: value, label: Value, type: string }
      - name: workflowSteps
        label: Workflow Steps
        type: object
        list: true
        fields:
          - { name: label, label: Label, type: string }
          - { name: text, label: Text, type: text }
      - name: lessons
        label: Lessons
        type: object
        list: true
        fields:
          - { name: label, label: Label, type: string }
          - { name: text, label: Text, type: text }
          - name: kind
            label: Kind
            type: select
            options: [win, lesson, fail]
      - { name: lockedTraits, label: Locked Traits, type: string, list: true }
      - { name: flexibleTraits, label: Flexible Traits, type: string, list: true }
      - name: specimenSheet
        label: Specimen Sheet
        type: object
        fields:
          - { name: specimenId, label: Specimen ID, type: string }
          - { name: subjectName, label: Subject Name, type: string }
          - { name: subjectRole, label: Subject Role, type: string }
          - { name: edition, label: Edition, type: string }
          - { name: status, label: Status, type: string }
          - { name: origin, label: Origin, type: string }
          - { name: creator, label: Creator, type: string }
          - { name: license, label: License, type: string }
          - { name: dropDate, label: Drop Date, type: date }
          - { name: dimensions, label: Dimensions, type: string }
      - name: colorChemistry
        label: Color Chemistry
        type: object
        fields:
          - name: palette
            label: Palette
            type: object
            list: true
            fields:
              - { name: name, label: Name, type: string }
