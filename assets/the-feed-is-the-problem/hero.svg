<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">A behavioral signal becomes a ranked feedback loop while an RSS route remains reader-controlled</title>
  <desc id="desc">An editorial control-board diagram shows a person encountering negative information, producing an ambiguous attention signal, receiving more ranked material, and sending metrics back toward production. A separate cyan RSS line connects a chosen source directly to the reader.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b12"/>
      <stop offset="1" stop-color="#17111a"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8b3d"/>
      <stop offset="1" stop-color="#ef4f78"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowWarm" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#ff7a45"/></marker>
    <marker id="arrowCyan" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#55d7ff"/></marker>
    <style>
      .eyebrow{font:600 18px 'IBM Plex Mono',monospace;letter-spacing:4px;fill:#8b94a7}.label{font:500 27px 'IBM Plex Sans',sans-serif;fill:#f5f7fb}.small{font:500 17px 'IBM Plex Mono',monospace;letter-spacing:2px;fill:#aab1bf}.node{fill:#111722;stroke:#3c4658;stroke-width:2}.warm{stroke:#ff7546}.cyan{stroke:#55d7ff}.muted{fill:#7d8798}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <path d="M0 112H1600M0 787H1600" stroke="#252c38" stroke-width="2"/>
  <text x="92" y="78" class="eyebrow">BEHAVIOR BECOMES A SIGNAL</text>
  <text x="1208" y="78" class="eyebrow">CONTROL BOARD 01</text>

  <g transform="translate(85 178)">
    <rect class="node warm" width="300" height="132" rx="8"/>
    <circle cx="42" cy="42" r="11" fill="#ff7546" filter="url(#glow)"/>
    <text x="72" y="50" class="small">INPUT</text>
    <text x="34" y="92" class="label">Negative information</text>
  </g>
  <path d="M389 244H512" fill="none" stroke="#ff7546" stroke-width="5" marker-end="url(#arrowWarm)"/>

  <g transform="translate(530 178)">
    <rect class="node warm" width="300" height="132" rx="8"/>
    <circle cx="42" cy="42" r="11" fill="#ff7546" filter="url(#glow)"/>
    <text x="72" y="50" class="small">OBSERVED</text>
    <text x="34" y="92" class="label">Pause, click, return</text>
  </g>
  <path d="M834 244H957" fill="none" stroke="#ff7546" stroke-width="5" marker-end="url(#arrowWarm)"/>

  <g transform="translate(975 178)">
    <rect class="node warm" width="300" height="132" rx="8"/>
    <circle cx="42" cy="42" r="11" fill="#ff7546" filter="url(#glow)"/>
    <text x="72" y="50" class="small">INFERRED</text>
    <text x="34" y="92" class="label">Relevant to this person</text>
  </g>
  <path d="M1279 244H1403V495H1294" fill="none" stroke="#ff7546" stroke-width="5" marker-end="url(#arrowWarm)"/>

  <g transform="translate(975 430)">
    <rect class="node warm" width="300" height="132" rx="8"/>
    <circle cx="42" cy="42" r="11" fill="#ff7546" filter="url(#glow)"/>
    <text x="72" y="50" class="small">DISTRIBUTED</text>
    <text x="34" y="92" class="label">More of the pattern</text>
  </g>
  <path d="M971 496H848" fill="none" stroke="#ff7546" stroke-width="5" marker-end="url(#arrowWarm)"/>

  <g transform="translate(530 430)">
    <rect class="node warm" width="300" height="132" rx="8"/>
    <circle cx="42" cy="42" r="11" fill="#ff7546" filter="url(#glow)"/>
    <text x="72" y="50" class="small">RETURNED</text>
    <text x="34" y="92" class="label">Metrics to production</text>
  </g>
  <path d="M526 496H402V329H530" fill="none" stroke="#ff7546" stroke-width="5" stroke-dasharray="14 14" marker-end="url(#arrowWarm)"/>

  <g transform="translate(85 430)">
    <rect class="node" width="300" height="132" rx="8"/>
    <circle cx="42" cy="42" r="11" fill="#8791a2"/>
    <text x="72" y="50" class="small">UNOBSERVED</text>
    <text x="34" y="92" class="label">Why the person stayed</text>
  </g>
  <path d="M385 496H466" fill="none" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 12"/>

  <g transform="translate(85 680)">
    <text x="0" y="-35" class="eyebrow" fill="#55d7ff">READER-CONTROLLED ROUTE</text>
    <rect class="node cyan" width="330" height="80" rx="8"/>
    <text x="30" y="50" class="label">Chosen source</text>
    <path d="M346 40H555" fill="none" stroke="#55d7ff" stroke-width="5" marker-end="url(#arrowCyan)"/>
    <rect x="575" class="node cyan" width="330" height="80" rx="8"/>
    <text x="605" y="50" class="label">RSS item</text>
    <path d="M921 40H1130" fill="none" stroke="#55d7ff" stroke-width="5" marker-end="url(#arrowCyan)"/>
    <rect x="1150" class="node cyan" width="330" height="80" rx="8"/>
    <text x="1180" y="50" class="label">Reader's folder</text>
  </g>
  <text x="92" y="850" class="small">SOLID: MEASURED EVENT</text>
  <text x="485" y="850" class="small">DASHED: SYSTEM RESPONSE</text>
  <text x="1220" y="850" class="small" fill="#55d7ff">ORIGINAL HOBFARM GRAPHIC</text>
</svg>
