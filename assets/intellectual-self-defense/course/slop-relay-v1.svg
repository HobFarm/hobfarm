y="0">Reaction</tspan></text><path d="M 1186 364 L 1212 364" fill="none" stroke="#f45fc5" stroke-width="4"  marker-end="url(#arrow)"/><rect x="1220" y="320" width="128" height="88" rx="18" class="panel" style="--accent:#f45fc5" /><text x="1284" y="372" class="box-label" text-anchor="middle"><tspan x="1284" dy="0">Summary</tspan></text><path d="M 1348 364 L 1374 364" fill="none" stroke="#f45fc5" stroke-width="4"  marker-end="url(#arrow)"/><rect x="1382" y="320" width="128" height="88" rx="18" class="panel" style="--accent:#ff5d64" /><text x="1446" y="372" class="box-label" text-anchor="middle"><tspan x="1446" dy="0">Opinion</tspan></text>
