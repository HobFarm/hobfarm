      <rect x="86" y="684" width="1428" height="82" rx="18" class="panel" style="--accent:#ffd34d" />
      <text x="800" y="735" class="body" text-anchor="middle"><tspan x="800" dy="0">Input contract · output contract · human check · next job · stop condition</tspan></text>
    
