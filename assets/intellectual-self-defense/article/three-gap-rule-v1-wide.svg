<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Three kinds of gaps</title>
  <desc id="desc">Fact gaps need evidence, creative gaps may allow invention, and decision gaps require human permission.</desc>
  <defs>
    <pattern id="paper" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M0 35.5H36" stroke="#f3e6c8" stroke-opacity=".035"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".28"/></filter>
  </defs>
  <style>
    text { font-family: "IBM Plex Sans", Arial, sans-serif; }
    .kicker { fill: #56e5ee; font-family: "IBM Plex Mono", monospace; font-size: 20px; font-weight: 700; letter-spacing: 3px; }
    .title { fill: #f3e6c8; font-size: 52px; font-weight: 700; }
    .subtitle { fill: #b9aeca; font-size: 22px; }
    .heading { fill: #f3e6c8; font-size: 28px; font-weight: 700; }
    .body { fill: #b9aeca; font-size: 21px; }
    .small { fill: #b9aeca; font-family: "IBM Plex Mono", monospace; font-size: 17px; }
    .box-label { fill: #f3e6c8; font-size: 20px; font-weight: 700; }
    .chip { font-family: "IBM Plex Mono", monospace; font-size: 15px; font-weight: 700; letter-spacing: 1px; }
    .panel { fill: #2b1839; fill-opacity: .9; stroke: var(--accent); stroke-width: 2; filter: url(#shadow); }
  </style>
  <rect width="1600" height="900" fill="#0b0711"/>
  <rect width="1600" height="900" fill="url(#paper)"/>
  <rect x="54" y="46" width="1492" height="808" rx="28" fill="none" stroke="#f3e6c8" stroke-opacity=".18" stroke-width="2"/>
  <text x="86" y="96" class="kicker" text-anchor="start"><tspan x="86" dy="0">HOBFARM FIELD DIAGRAM</tspan></text>
  <text x="86" y="160" class="title" text-anchor="start"><tspan x="86" dy="0">Three kinds of gaps</tspan></text>
  <text x="86" y="202" class="subtitle" text-anchor="start"><tspan x="86" dy="0">Missing information does not always authorize the same repair.</tspan></text>
  
      <rect x="86" y="278" width="436" height="430" rx="18" class="panel" style="--accent:#56e5ee" />
      <text x="120" y="334" class="kicker" text-anchor="start"><tspan x="120" dy="0">FACT GAP</tspan></text>
      <text x="120" y="390" class="heading" text-anchor="start"><tspan x="120" dy="0">Evidence or unknown</tspan></text>
      <text x="120" y="444" class="body" text-anchor="start"><tspan x="120" dy="0">Missing date</tspan><tspan x="120" dy="44">Missing source</tspan><tspan x="120" dy="44">Missing quotation</tspan><tspan x="120" dy="44">Missing cause</tspan></text>
      <g><rect x="120" y="628" width="250" height="38" rx="19" fill="#ff5d64" fill-opacity=".13" stroke="#ff5d64"/><text x="245" y="653" class="chip" text-anchor="middle" fill="#ff5d64">DO NOT INVENT</text></g>
      <rect x="582" y="278" width="436" height="430" rx="18" class="panel" style="--accent:#f45fc5" />
      <text x="616" y="334" class="kicker" text-anchor="start"><tspan x="616" dy="0">CREATIVE GAP</tspan></text>
      <text x="616" y="390" class="heading" text-anchor="start"><tspan x="616" dy="0">Authorized invention</tspan></text>
      <text x="616" y="444" class="body" text-anchor="start"><tspan x="616" dy="0">Accessory</tspan><tspan x="616" dy="44">Pose</tspan><tspan x="616" dy="44">Soundtrack</tspan><tspan x="616" dy="44">Fictional background</tspan></text>
      <g><rect x="616" y="628" width="276" height="38" rx="19" fill="#f45fc5" fill-opacity=".13" stroke="#f45fc5"/><text x="754" y="653" class="chip" text-anchor="middle" fill="#f45fc5">INVENT WITHIN SCOPE</text></g>
      <rect x="1078" y="278" width="436" height="430" rx="18" class="panel" style="--accent:#ffd34d" />
      <text x="1112" y="334" class="kicker" text-anchor="start"><tspan x="1112" dy="0">DECISION GAP</tspan></text>
      <text x="1112" y="390" class="heading" text-anchor="start"><tspan x="1112" dy="0">Permission required</tspan></text>
      <text x="1112" y="444" class="body" text-anchor="start"><tspan x="1112" dy="0">Name or canon</tspan><tspan x="1112" dy="44">Final argument</tspan><tspan x="1112" dy="44">Publish or share</tspan><tspan x="1112" dy="44">Belief or action</tspan></text>
      <g><rect x="1112" y="628" width="304" height="38" rx="19" fill="#ffd34d" fill-opacity=".13" stroke="#ffd34d"/><text x="1264" y="653" class="chip" text-anchor="middle" fill="#ffd34d">RETURN TO THE HUMAN</text></g>
    
</svg>