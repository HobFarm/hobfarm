<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1500" viewBox="0 0 900 1500" role="img" aria-labelledby="title desc">
  <title id="title">RSS and feed interface timeline from 1999 to 2026</title>
  <desc id="desc">A vertical timeline marks RSS 0.90, enclosures, Atom, the author's 2006 video publishing period, Google Reader's closure, Firefox removing built-in feed tools, and a 2026 revival of attention.</desc>
  <rect width="900" height="1500" rx="28" fill="#0b0d19"/>
  <text x="64" y="78" fill="#ffb44f" font-family="IBM Plex Mono, monospace" font-size="18" letter-spacing="4">OPEN FORMAT, VANISHING INTERFACE</text>
  <text x="64" y="128" fill="#f1eff8" font-family="IBM Plex Sans, sans-serif" font-size="34" font-weight="700">The feed stayed. The buttons faded.</text>
  <line x1="180" y1="212" x2="180" y2="1360" stroke="#514b63" stroke-width="4"/>
  <g font-family="IBM Plex Sans, sans-serif">
    <g transform="translate(0 235)"><circle cx="180" r="15" fill="#ff7a33"/><text x="64" y="7" fill="#ffb44f" font-family="IBM Plex Mono, monospace" font-size="22">1999</text><text x="230" y="-5" fill="#fff" font-size="25" font-weight="700">RSS 0.90</text><text x="230" y="30" fill="#aaa6ba" font-size="18">Netscape publishes the specification.</text><text x="230" y="59" fill="#aaa6ba" font-size="18">Sites are told to add an “Add Channel” button.</text></g>
    <g transform="translate(0 405)"><circle cx="180" r="15" fill="#ff9739"/><text x="64" y="7" fill="#ffb44f" font-family="IBM Plex Mono, monospace" font-size="22">2000</text><text x="230" y="-5" fill="#fff" font-size="25" font-weight="700">RSS 0.92 enclosures</text><text x="230" y="30" fill="#aaa6ba" font-size="18">A feed item can point to a media file.</text><text x="230" y="59" fill="#aaa6ba" font-size="18">The mechanism becomes essential to podcasting.</text></g>
    <g transform="translate(0 575)"><circle cx="180" r="15" fill="#ffb44f"/><text x="64" y="7" fill="#ffcf76" font-family="IBM Plex Mono, monospace" font-size="22">2005</text><text x="230" y="-5" fill="#fff" font-size="25" font-weight="700">Atom becomes an IETF standard</text><text x="230" y="30" fill="#aaa6ba" font-size="18">A separate open syndication format, RFC 4287.</text></g>
    <g transform="translate(0 720)"><circle cx="180" r="19" fill="#55d7ff"/><circle cx="180" r="32" fill="none" stroke="#55d7ff" stroke-opacity=".35"/><text x="64" y="7" fill="#55d7ff" font-family="IBM Plex Mono, monospace" font-size="22">2006</text><text x="230" y="-5" fill="#fff" font-size="25" font-weight="700">Video, feeds, and email-style readers</text><text x="230" y="30" fill="#b4c9d5" font-size="18">The author's remembered publishing period.</text><text x="230" y="59" fill="#b4c9d5" font-size="18">YouTube is new; feed controls are still visible.</text></g>
    <g transform="translate(0 890)"><circle cx="180" r="15" fill="#bd789a"/><text x="64" y="7" fill="#d59bb7" font-family="IBM Plex Mono, monospace" font-size="22">2013</text><text x="230" y="-5" fill="#fff" font-size="25" font-weight="700">Google Reader closes</text><text x="230" y="30" fill="#aaa6ba" font-size="18">A major consumer interface disappears.</text><text x="230" y="59" fill="#aaa6ba" font-size="18">The feed specifications keep working.</text></g>
    <g transform="translate(0 1060)"><circle cx="180" r="15" fill="#916f92"/><text x="64" y="7" fill="#c098c3" font-family="IBM Plex Mono, monospace" font-size="22">2018</text><text x="230" y="-5" fill="#fff" font-size="25" font-weight="700">Firefox removes built-in feed tools</text><text x="230" y="30" fill="#aaa6ba" font-size="18">Feed preview and Live Bookmarks leave Firefox 64.</text></g>
    <g transform="translate(0 1225)"><circle cx="180" r="19" fill="#ffb44f"/><circle cx="180" r="32" fill="none" stroke="#ffb44f" stroke-opacity=".35"/><text x="64" y="7" fill="#ffcf76" font-family="IBM Plex Mono, monospace" font-size="22">2026</text><text x="230" y="-5" fill="#fff" font-size="25" font-weight="700">Feeds return to the argument</text><text x="230" y="30" fill="#d0c4ad" font-size="18">A 92-feed OPML cold start circulates widely.</text><text x="230" y="59" fill="#d0c4ad" font-size="18">Readers reconsider direct subscription.</text></g>
  </g>
  <text x="64" y="1438" fill="#77758e" font-family="IBM Plex Sans, sans-serif" font-size="15">Dates: RSS Advisory Board, IETF, Google, and Mozilla • Original HobFarm graphic</text>
</svg>
