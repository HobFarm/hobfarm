<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1160" viewBox="0 0 900 1160" role="img" aria-labelledby="title desc">
  <title id="title">One feed can serve many kinds of readers and software</title>
  <desc id="desc">A central feed branches to a reader app, podcast app, alert monitor, research folder, archive, script, and personal AI digest.</desc>
  <defs><radialGradient id="hub"><stop stop-color="#3c2a20"/><stop offset="1" stop-color="#151421"/></radialGradient></defs>
  <rect width="900" height="1160" rx="28" fill="#0b0d19"/>
  <text x="60" y="78" fill="#55d7ff" font-family="IBM Plex Mono, monospace" font-size="18" letter-spacing="4">ONE OPEN OUTPUT</text>
  <text x="60" y="128" fill="#f1eff8" font-family="IBM Plex Sans, sans-serif" font-size="34" font-weight="700">A feed is useful beyond a blog reader.</text>

  <g stroke="#655879" stroke-width="4" fill="none"><path d="M450 525 205 330"/><path d="M450 525 695 330"/><path d="M450 525 170 560"/><path d="M450 525 730 560"/><path d="M450 525 215 790"/><path d="M450 525 685 790"/><path d="M450 525V930"/></g>
  <circle cx="450" cy="525" r="128" fill="url(#hub)" stroke="#ffb44f" stroke-width="4"/>
  <circle cx="414" cy="565" r="15" fill="#ffb44f"/><path d="M404 522a57 57 0 0 1 57 57M404 483a96 96 0 0 1 96 96" fill="none" stroke="#ffb44f" stroke-width="14" stroke-linecap="round"/>
  <text x="450" y="635" fill="#fff" font-family="IBM Plex Mono, monospace" font-size="22" text-anchor="middle" letter-spacing="3">RSS / ATOM</text>

  <g font-family="IBM Plex Sans, sans-serif">
    <g transform="translate(70 225)"><rect width="270" height="126" rx="14" fill="#161727" stroke="#55d7ff"/><text x="135" y="50" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">Reader app</text><text x="135" y="82" text-anchor="middle" fill="#aaa6ba" font-size="18">articles in one inbox</text></g>
    <g transform="translate(560 225)"><rect width="270" height="126" rx="14" fill="#161727" stroke="#f24da6"/><text x="135" y="50" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">Podcast app</text><text x="135" y="82" text-anchor="middle" fill="#aaa6ba" font-size="18">episodes via enclosures</text></g>
    <g transform="translate(40 500)"><rect width="250" height="126" rx="14" fill="#161727" stroke="#f07b8f"/><text x="125" y="50" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">Alert monitor</text><text x="125" y="82" text-anchor="middle" fill="#aaa6ba" font-size="18">weather and earthquakes</text></g>
    <g transform="translate(610 500)"><rect width="250" height="126" rx="14" fill="#161727" stroke="#a9d672"/><text x="125" y="50" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">Research folder</text><text x="125" y="82" text-anchor="middle" fill="#aaa6ba" font-size="18">papers and filings</text></g>
    <g transform="translate(80 745)"><rect width="270" height="126" rx="14" fill="#161727" stroke="#9f8cff"/><text x="135" y="50" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">Archive</text><text x="135" y="82" text-anchor="middle" fill="#aaa6ba" font-size="18">stable item history</text></g>
    <g transform="translate(550 745)"><rect width="270" height="126" rx="14" fill="#161727" stroke="#ffb44f"/><text x="135" y="50" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">Script or service</text><text x="135" y="82" text-anchor="middle" fill="#aaa6ba" font-size="18">search and automation</text></g>
    <g transform="translate(285 930)"><rect width="330" height="130" rx="14" fill="#13202a" stroke="#55d7ff" stroke-width="2"/><text x="165" y="50" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">Personal AI digest</text><text x="165" y="82" text-anchor="middle" fill="#b0c3cf" font-size="18">summarizes chosen sources</text></g>
  </g>
  <text x="60" y="1120" fill="#77758e" font-family="IBM Plex Sans, sans-serif" font-size="15">Examples documented by Apple, YouTube, GitHub, arXiv, USGS, NWS, SEC, and GovInfo</text>
</svg>
