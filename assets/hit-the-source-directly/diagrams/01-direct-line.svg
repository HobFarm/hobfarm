<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">A direct RSS line from HobFarm to its readers</title>
  <desc id="desc">An orange feed line runs from a HobFarm publishing terminal to three reader screens. A tangled engagement factory sits below but does not touch the direct line.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080b16"/><stop offset="1" stop-color="#14102a"/></linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff7a33"/><stop offset=".48" stop-color="#ffbb4d"/><stop offset="1" stop-color="#55d7ff"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#7775a4" stroke-opacity=".09"/></pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <circle cx="210" cy="268" r="180" fill="#ff7a33" opacity=".05"/>
  <circle cx="1360" cy="272" r="210" fill="#55d7ff" opacity=".05"/>

  <text x="94" y="88" fill="#ffbb4d" font-family="IBM Plex Mono, monospace" font-size="22" letter-spacing="5">PUBLISH → SUBSCRIBE → RECEIVE</text>
  <text x="94" y="138" fill="#f4f2ff" font-family="IBM Plex Sans, sans-serif" font-size="30" font-weight="600">One source. One open address. Reader-chosen delivery.</text>

  <rect x="92" y="212" width="340" height="246" rx="18" fill="#11162a" stroke="#ff7a33" stroke-width="3"/>
  <rect x="118" y="242" width="88" height="88" rx="12" fill="#ff7a33"/>
  <circle cx="144" cy="304" r="10" fill="#080b16"/>
  <path d="M138 278a42 42 0 0 1 42 42M138 256a64 64 0 0 1 64 64" fill="none" stroke="#080b16" stroke-width="10" stroke-linecap="round"/>
  <text x="232" y="280" fill="#f4f2ff" font-family="IBM Plex Sans, sans-serif" font-size="32" font-weight="700">HOBFARM</text>
  <text x="232" y="320" fill="#a6a3bc" font-family="IBM Plex Mono, monospace" font-size="18">ARTICLE SOURCE</text>
  <line x1="118" y1="365" x2="406" y2="365" stroke="#34354f"/>
  <text x="118" y="402" fill="#d8d5e5" font-family="IBM Plex Sans, sans-serif" font-size="22">https://hob.farm/rss.xml</text>
  <text x="118" y="434" fill="#77758e" font-family="IBM Plex Sans, sans-serif" font-size="18">Open feed • stable address</text>

  <path d="M432 334H1174" stroke="#ff9a3e" stroke-opacity=".18" stroke-width="34" filter="url(#glow)"/>
  <path d="M432 334H1174" stroke="#ffb44f" stroke-width="10" stroke-linecap="round"/>
  <circle cx="604" cy="334" r="14" fill="#ffab43"/>
  <circle cx="800" cy="334" r="14" fill="#ffc54f"/>
  <circle cx="996" cy="334" r="14" fill="#8be3ee"/>
  <rect x="650" y="224" width="300" height="66" rx="33" fill="#211b2f" stroke="#ffbb4d"/>
  <text x="800" y="266" fill="#ffcc69" font-family="IBM Plex Mono, monospace" font-size="22" text-anchor="middle" letter-spacing="3">DIRECT FEED</text>
  <text x="800" y="383" fill="#d8d5e5" font-family="IBM Plex Mono, monospace" font-size="18" text-anchor="middle">NO ENGAGEMENT RANKING QUEUE</text>

  <g transform="translate(1174 190)">
    <rect width="332" height="292" rx="20" fill="#101728" stroke="#55d7ff" stroke-width="3"/>
    <text x="30" y="48" fill="#55d7ff" font-family="IBM Plex Mono, monospace" font-size="18" letter-spacing="3">READERS</text>
    <g transform="translate(30 76)"><rect width="272" height="48" rx="8" fill="#1a2236" stroke="#3a4257"/><circle cx="26" cy="24" r="8" fill="#ff7a33"/><rect x="48" y="14" width="170" height="8" rx="4" fill="#eceaf7"/><rect x="48" y="29" width="112" height="6" rx="3" fill="#77758e"/></g>
    <g transform="translate(30 140)"><rect width="272" height="48" rx="8" fill="#1a2236" stroke="#3a4257"/><circle cx="26" cy="24" r="8" fill="#ffbb4d"/><rect x="48" y="14" width="190" height="8" rx="4" fill="#eceaf7"/><rect x="48" y="29" width="132" height="6" rx="3" fill="#77758e"/></g>
    <g transform="translate(30 204)"><rect width="272" height="48" rx="8" fill="#1a2236" stroke="#3a4257"/><circle cx="26" cy="24" r="8" fill="#55d7ff"/><rect x="48" y="14" width="154" height="8" rx="4" fill="#eceaf7"/><rect x="48" y="29" width="204" height="6" rx="3" fill="#77758e"/></g>
  </g>

  <g opacity=".72">
    <text x="94" y="575" fill="#8a879d" font-family="IBM Plex Mono, monospace" font-size="18" letter-spacing="3">THE ENGAGEMENT FACTORY</text>
    <path d="M96 630h160l62 72 82-94 92 111 84-56 86 85 94-137 92 110 82-65 88 93 98-142 106 127h208" fill="none" stroke="#5e5b73" stroke-width="4" stroke-dasharray="12 12"/>
    <g fill="#171526" stroke="#514e65"><rect x="115" y="618" width="166" height="62" rx="10"/><rect x="354" y="687" width="176" height="62" rx="10"/><rect x="630" y="607" width="188" height="62" rx="10"/><rect x="897" y="687" width="178" height="62" rx="10"/><rect x="1176" y="615" width="210" height="62" rx="10"/></g>
    <g fill="#9a96ad" font-family="IBM Plex Mono, monospace" font-size="17" text-anchor="middle"><text x="198" y="656">PROVOKE</text><text x="442" y="725">RANK</text><text x="724" y="645">REPEAT</text><text x="986" y="725">RETAIN</text><text x="1281" y="653">RECIRCULATE</text></g>
  </g>
  <text x="94" y="842" fill="#77758e" font-family="IBM Plex Sans, sans-serif" font-size="18">Original HobFarm explanatory graphic • August 2026</text>
</svg>
