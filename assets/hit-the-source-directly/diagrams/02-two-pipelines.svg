<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1160" viewBox="0 0 900 1160" role="img" aria-labelledby="title desc">
  <title id="title">Two distribution pipelines from publication to reader</title>
  <desc id="desc">A social pipeline runs through engagement ranking before reaching a reader. An RSS pipeline passes selected sources to the reader, who may add a personal filter afterward.</desc>
  <rect width="900" height="1160" rx="28" fill="#0b0d19"/>
  <text x="60" y="78" fill="#55d7ff" font-family="IBM Plex Mono, monospace" font-size="18" letter-spacing="4">TWO PIPELINES</text>
  <text x="60" y="128" fill="#f1eff8" font-family="IBM Plex Sans, sans-serif" font-size="34" font-weight="700">The difference is who chooses the sources.</text>
  <line x1="60" y1="168" x2="840" y2="168" stroke="#34354b"/>

  <text x="60" y="230" fill="#f07b8f" font-family="IBM Plex Mono, monospace" font-size="19" letter-spacing="3">ENGAGEMENT FEED</text>
  <g font-family="IBM Plex Sans, sans-serif">
    <rect x="60" y="270" width="220" height="110" rx="14" fill="#181827" stroke="#6c6a80"/><text x="170" y="318" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">Many sources</text><text x="170" y="350" text-anchor="middle" fill="#aaa6ba" font-size="18">posts enter</text>
    <path d="M280 325H340" stroke="#f07b8f" stroke-width="6"/><path d="m328 312 16 13-16 13" fill="none" stroke="#f07b8f" stroke-width="6"/>
    <rect x="350" y="245" width="250" height="160" rx="14" fill="#251623" stroke="#f07b8f" stroke-width="2"/><text x="475" y="296" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">Platform ranks</text><text x="475" y="330" text-anchor="middle" fill="#d8a2ac" font-size="18">predicted engagement</text><text x="475" y="361" text-anchor="middle" fill="#d8a2ac" font-size="18">chooses distribution</text>
    <path d="M600 325H660" stroke="#f07b8f" stroke-width="6"/><path d="m648 312 16 13-16 13" fill="none" stroke="#f07b8f" stroke-width="6"/>
    <rect x="670" y="270" width="170" height="110" rx="14" fill="#181827" stroke="#6c6a80"/><text x="755" y="318" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">Reader</text><text x="755" y="350" text-anchor="middle" fill="#aaa6ba" font-size="18">sees winners</text>
  </g>

  <text x="60" y="500" fill="#ffb44f" font-family="IBM Plex Mono, monospace" font-size="19" letter-spacing="3">DIRECT FEED</text>
  <g font-family="IBM Plex Sans, sans-serif">
    <rect x="60" y="545" width="220" height="120" rx="14" fill="#211c18" stroke="#ffb44f" stroke-width="2"/><text x="170" y="592" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">Chosen sources</text><text x="170" y="625" text-anchor="middle" fill="#d9b98b" font-size="18">you subscribe</text>
    <path d="M280 605H390" stroke="#ffb44f" stroke-width="7"/><path d="m378 592 16 13-16 13" fill="none" stroke="#ffb44f" stroke-width="6"/>
    <rect x="400" y="545" width="200" height="120" rx="14" fill="#211c18" stroke="#ffb44f" stroke-width="2"/><text x="500" y="592" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">RSS or Atom</text><text x="500" y="625" text-anchor="middle" fill="#d9b98b" font-size="18">chronological items</text>
    <path d="M600 605H660" stroke="#ffb44f" stroke-width="7"/><path d="m648 592 16 13-16 13" fill="none" stroke="#ffb44f" stroke-width="6"/>
    <rect x="670" y="545" width="170" height="120" rx="14" fill="#211c18" stroke="#ffb44f" stroke-width="2"/><text x="755" y="592" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">Reader</text><text x="755" y="625" text-anchor="middle" fill="#d9b98b" font-size="18">gets releases</text>
  </g>

  <path d="M755 665V740" stroke="#55d7ff" stroke-width="6" stroke-dasharray="10 10"/><path d="m742 728 13 16 13-16" fill="none" stroke="#55d7ff" stroke-width="6"/>
  <rect x="400" y="752" width="440" height="162" rx="16" fill="#111d27" stroke="#55d7ff" stroke-width="2"/>
  <text x="620" y="800" text-anchor="middle" fill="#55d7ff" font-family="IBM Plex Mono, monospace" font-size="18" letter-spacing="3">OPTIONAL, DOWNSTREAM</text>
  <text x="620" y="844" text-anchor="middle" fill="#fff" font-family="IBM Plex Sans, sans-serif" font-size="23" font-weight="700">Your filter, search, digest, or AI</text>
  <text x="620" y="878" text-anchor="middle" fill="#a9b7c4" font-family="IBM Plex Sans, sans-serif" font-size="18">operates on sources you selected first</text>

  <rect x="60" y="986" width="780" height="106" rx="14" fill="#151522" stroke="#39394d"/>
  <text x="90" y="1029" fill="#f1eff8" font-family="IBM Plex Sans, sans-serif" font-size="22" font-weight="700">RSS does not certify quality.</text>
  <text x="90" y="1063" fill="#aaa6ba" font-family="IBM Plex Sans, sans-serif" font-size="19">It changes the source-selection and distribution layer.</text>
  <text x="60" y="1130" fill="#77758e" font-family="IBM Plex Sans, sans-serif" font-size="15">Original HobFarm explanatory graphic • August 2026</text>
</svg>
