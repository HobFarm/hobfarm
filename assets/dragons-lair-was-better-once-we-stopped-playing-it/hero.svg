<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">An arcade cabinet becomes a small theater while the games around it remain games</title>
  <desc id="desc">Original editorial artwork shows a glowing two-quarter arcade cabinet with a cinema screen and branching directional prompts. Quarter-priced driving, fighting, fantasy, and racing cabinets surround it. A home computer glows in the distance.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09070d"/>
      <stop offset=".55" stop-color="#17101d"/>
      <stop offset="1" stop-color="#07131a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd46b"/>
      <stop offset=".52" stop-color="#f06b42"/>
      <stop offset="1" stop-color="#8b2f67"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1722"/>
      <stop offset="1" stop-color="#05060a"/>
    </linearGradient>
    <filter id="warmGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cyanGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="carpet" width="76" height="76" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="8" cy="8" r="2" fill="#684064"/>
      <path d="M0 38H76M38 0V76" stroke="#203e52" stroke-width="1" opacity=".55"/>
    </pattern>
    <style>
      .mono{font-family:'IBM Plex Mono',monospace;letter-spacing:3px}.sans{font-family:'IBM Plex Sans',sans-serif}.cabinet{fill:#10121a;stroke:#4b4655;stroke-width:3}.trim{fill:none;stroke:#55d7ff;stroke-width:4}.warm{fill:none;stroke:#ffb24e;stroke-width:5}.muted{fill:#7c7685}.white{fill:#f8f5ef}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <path d="M0 617L1600 570V900H0Z" fill="url(#floor)"/>
  <path d="M0 617L1600 570V900H0Z" fill="url(#carpet)" opacity=".7"/>
  <path d="M0 612L1600 565" stroke="#36303e" stroke-width="5"/>

  <g opacity=".78" transform="translate(82 266)">
    <path class="cabinet" d="M0 44L25 0H235L260 44V398H0Z"/>
    <rect x="31" y="58" width="198" height="118" rx="5" fill="#0a2833" stroke="#55d7ff" stroke-width="3"/>
    <path d="M65 139L111 92L153 128L193 83" class="trim"/>
    <path d="M40 217H220L203 286H57Z" fill="#191b24" stroke="#575160" stroke-width="3"/>
    <circle cx="92" cy="245" r="14" fill="#ef4f78"/><path d="M154 259V229M139 244H169" stroke="#f5f1e8" stroke-width="7"/>
    <rect x="79" y="319" width="102" height="35" fill="#08090d" stroke="#55d7ff" stroke-width="2"/>
    <text x="130" y="342" text-anchor="middle" class="mono" font-size="15" fill="#55d7ff">25¢</text>
  </g>

  <g opacity=".7" transform="translate(1267 248)">
    <path class="cabinet" d="M0 44L25 0H235L260 44V398H0Z"/>
    <rect x="31" y="58" width="198" height="118" rx="5" fill="#301626" stroke="#ef4f78" stroke-width="3"/>
    <circle cx="130" cy="117" r="37" fill="none" stroke="#ef4f78" stroke-width="8"/>
    <path d="M40 217H220L203 286H57Z" fill="#191b24" stroke="#575160" stroke-width="3"/>
    <circle cx="92" cy="245" r="14" fill="#ffb24e"/><path d="M154 259V229M139 244H169" stroke="#f5f1e8" stroke-width="7"/>
    <rect x="79" y="319" width="102" height="35" fill="#08090d" stroke="#ef4f78" stroke-width="2"/>
    <text x="130" y="342" text-anchor="middle" class="mono" font-size="15" fill="#ef4f78">25¢</text>
  </g>

  <g transform="translate(497 92)">
    <ellipse cx="310" cy="662" rx="340" ry="72" fill="#f27838" opacity=".15" filter="url(#warmGlow)"/>
    <path d="M35 109L91 0H529L585 109V655H35Z" fill="#0d0e14" stroke="#726172" stroke-width="5"/>
    <path d="M74 127H546V390H74Z" fill="#07070a" stroke="#f0a346" stroke-width="7"/>
    <rect x="93" y="146" width="434" height="225" rx="4" fill="url(#screen)" filter="url(#warmGlow)"/>
    <path d="M310 177L377 244L310 311L243 244Z" fill="#17101d" opacity=".76"/>
    <path d="M310 194V294M260 244H360" stroke="#ffeac2" stroke-width="12" stroke-linecap="square"/>
    <path d="M75 429H545L510 519H110Z" fill="#191820" stroke="#625867" stroke-width="4"/>
    <circle cx="234" cy="467" r="23" fill="#ef4f78"/><path d="M368 492V442M343 467H393" stroke="#ffeac2" stroke-width="11"/>
    <rect x="179" y="554" width="262" height="64" rx="3" fill="#07080c" stroke="#f0a346" stroke-width="4"/>
    <circle cx="246" cy="586" r="18" fill="#f0a346" filter="url(#warmGlow)"/>
    <circle cx="374" cy="586" r="18" fill="#f0a346" filter="url(#warmGlow)"/>
    <text x="310" y="91" text-anchor="middle" class="mono" font-size="21" fill="#f0a346">ANIMATED ADVENTURE</text>
    <text x="310" y="649" text-anchor="middle" class="mono" font-size="17" fill="#f0a346">TWO COINS • THREE LIVES</text>
  </g>

  <g transform="translate(1150 80)" filter="url(#cyanGlow)">
    <rect width="328" height="182" rx="5" fill="#09151d" stroke="#55d7ff" stroke-width="4"/>
    <rect x="25" y="24" width="278" height="112" fill="#071014" stroke="#2786a4" stroke-width="2"/>
    <path d="M53 110L83 74L108 93L139 49L178 93L212 63L274 111" fill="none" stroke="#55d7ff" stroke-width="5"/>
    <rect x="127" y="150" width="74" height="10" fill="#55d7ff"/>
  </g>
  <path d="M1196 328C1129 411 1097 510 1087 612" fill="none" stroke="#55d7ff" stroke-width="4" stroke-dasharray="14 16" opacity=".6"/>

  <g transform="translate(76 75)">
    <text class="mono" font-size="18" fill="#a7a0ad">ARCADE ECONOMICS • 1983</text>
    <text y="48" class="sans white" font-size="34">The cartoon was spectacular.</text>
    <text y="88" class="sans" font-size="34" fill="#f0a346">The transaction was not.</text>
  </g>
  <g transform="translate(78 826)">
    <text class="mono" font-size="15" fill="#918a98">ORIGINAL HOBFARM EDITORIAL ART</text>
    <text x="1100" class="mono" font-size="15" fill="#55d7ff">25¢ + 25¢ → WATCH</text>
  </g>
</svg>
