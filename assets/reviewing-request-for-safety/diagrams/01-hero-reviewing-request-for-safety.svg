<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Controlled input and mediated output</title>
<desc id="desc">A request passes through review layers that reorder requirements before an altered approved output emerges.</desc>
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#18222B" flood-opacity="0.13"/>
  </filter>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#18222B" flood-opacity="0.10"/>
  </filter>
  <pattern id="paperGrid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#B9B4A8" stroke-opacity="0.14" stroke-width="1"/>
  </pattern>
  <marker id="arrowInk" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 z" fill="#18222B"/>
  </marker>
  <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 z" fill="#B84B45"/>
  </marker>
  <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 z" fill="#45687A"/>
  </marker>
</defs>
<rect width="100%" height="100%" fill="#F2EBDD"/>
<rect width="100%" height="100%" fill="url(#paperGrid)"/>
<text x="70" y="55" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#45687A" text-anchor="start" letter-spacing="2.2">CONTROLLED INPUT / MEDIATED OUTPUT</text><text x="1530" y="55" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="600" fill="#65727D" text-anchor="end" letter-spacing="1.0">HOBFARM SYSTEMS NOTE / 08.14.2026</text><line x1="70" y1="76" x2="1530" y2="76" stroke="#B9B4A8" stroke-width="2" stroke-linecap="round"/><text x="70" y="145" font-family="DejaVu Sans, Arial, sans-serif" font-size="66" font-weight="800" fill="#18222B" text-anchor="start"><tspan x="70" dy="0">THE REQUEST ENTERS</tspan><tspan x="70" dy="74">THE PRODUCT DECIDES</tspan></text><text x="70" y="305" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="500" fill="#45687A" text-anchor="start"><tspan x="70" dy="0">The request is clear. The review decides what</tspan><tspan x="70" dy="36">survives.</tspan></text><rect x="70" y="410" width="410" height="430" rx="18" fill="#FBF8F0" stroke="#18222B" stroke-width="2" filter="url(#shadow)"/><rect x="98" y="438" width="170" height="42" rx="21.0" fill="#DCE8EC" stroke="#45687A" stroke-width="2"/><text x="183.0" y="465.72" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#45687A" text-anchor="middle" letter-spacing="0.4">ORIGINAL REQUEST</text><text x="100" y="520" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="800" fill="#18222B" text-anchor="start" letter-spacing="1.2">INTENT CONTRACT</text><circle cx="122" cy="562" r="20" fill="#647F67"/><text x="122" y="569" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="158" y="555" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#647F67" text-anchor="start" letter-spacing="1.0">PRIMARY</text><text x="158" y="587" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="600" fill="#18222B" text-anchor="start">Preserve exact requirements</text><circle cx="122" cy="648" r="20" fill="#45687A"/><text x="122" y="655" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="158" y="641" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#45687A" text-anchor="start" letter-spacing="1.0">REFERENCE</text><text x="158" y="673" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="600" fill="#18222B" text-anchor="start">Apply visual language</text><circle cx="122" cy="734" r="20" fill="#647F67"/><text x="122" y="741" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="158" y="727" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#647F67" text-anchor="start" letter-spacing="1.0">OUTPUT</text><text x="158" y="759" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="600" fill="#18222B" text-anchor="start">Review against source</text><text x="100" y="810" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="800" fill="#65727D" text-anchor="start" letter-spacing="1.6">SCHEMA ATTACHED</text><rect x="575" y="420" width="360" height="250" rx="16" fill="#DCE8EC" stroke="#45687A" stroke-width="2" filter="url(#softShadow)"/><text x="601" y="465" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="800" fill="#45687A" text-anchor="start" letter-spacing="1.4">INTERPRETATION</text><line x1="601" y1="483" x2="905" y2="483" stroke="#45687A" stroke-width="2" stroke-linecap="round" opacity="0.55"/><text x="603" y="525" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="800" fill="#65727D" text-anchor="start" letter-spacing="1.2">REVIEW STATUS</text><rect x="603" y="547" width="250" height="18" rx="9" fill="#B9B4A8" stroke-width="0" opacity="0.35"/><rect x="603" y="584" width="190" height="18" rx="9" fill="#45687A" stroke-width="0" opacity="0.62"/><rect x="599" y="477" width="360" height="250" rx="16" fill="#F1DAD5" stroke="#B84B45" stroke-width="2" filter="url(#softShadow)"/><text x="625" y="522" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="800" fill="#B84B45" text-anchor="start" letter-spacing="1.4">POLICY</text><line x1="625" y1="540" x2="929" y2="540" stroke="#B84B45" stroke-width="2" stroke-linecap="round" opacity="0.55"/><text x="627" y="582" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="800" fill="#65727D" text-anchor="start" letter-spacing="1.2">REVIEW STATUS</text><rect x="627" y="604" width="250" height="18" rx="9" fill="#B9B4A8" stroke-width="0" opacity="0.35"/><rect x="627" y="641" width="214" height="18" rx="9" fill="#B84B45" stroke-width="0" opacity="0.62"/><rect x="623" y="534" width="360" height="250" rx="16" fill="#FBF8F0" stroke="#D5B864" stroke-width="2" filter="url(#softShadow)"/><text x="649" y="579" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="800" fill="#D5B864" text-anchor="start" letter-spacing="1.4">OPTIMIZATION</text><line x1="649" y1="597" x2="953" y2="597" stroke="#D5B864" stroke-width="2" stroke-linecap="round" opacity="0.55"/><text x="651" y="639" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="800" fill="#65727D" text-anchor="start" letter-spacing="1.2">REVIEW STATUS</text><rect x="651" y="661" width="250" height="18" rx="9" fill="#B9B4A8" stroke-width="0" opacity="0.35"/><rect x="651" y="698" width="238" height="18" rx="9" fill="#D5B864" stroke-width="0" opacity="0.62"/><rect x="647" y="591" width="360" height="250" rx="16" fill="#DEE8DC" stroke="#647F67" stroke-width="2" filter="url(#softShadow)"/><text x="673" y="636" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="800" fill="#647F67" text-anchor="start" letter-spacing="1.4">SELECTION</text><line x1="673" y1="654" x2="977" y2="654" stroke="#647F67" stroke-width="2" stroke-linecap="round" opacity="0.55"/><text x="675" y="696" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="800" fill="#65727D" text-anchor="start" letter-spacing="1.2">REVIEW STATUS</text><rect x="675" y="718" width="250" height="18" rx="9" fill="#B9B4A8" stroke-width="0" opacity="0.35"/><rect x="675" y="755" width="262" height="18" rx="9" fill="#647F67" stroke-width="0" opacity="0.62"/><path d="M 475 600 C 535 600, 560 600, 615 600" fill="none" stroke="#18222B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowInk)"/><path d="M 840 718 C 960 690, 950 555, 1040 545" fill="none" stroke="#B84B45" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowRed)"/><text x="832" y="760" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" fill="#B84B45" text-anchor="middle" font-style="italic">priority reassigned</text><rect x="1090" y="410" width="440" height="430" rx="18" fill="#FBF8F0" stroke="#18222B" stroke-width="2" filter="url(#shadow)"/><rect x="1118" y="438" width="190" height="42" rx="21.0" fill="#DEE8DC" stroke="#647F67" stroke-width="2"/><text x="1213.0" y="465.72" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#647F67" text-anchor="middle" letter-spacing="0.4">APPROVED OUTPUT</text><text x="1120" y="520" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="800" fill="#18222B" text-anchor="start" letter-spacing="1.2">FINAL CHECKLIST</text><rect x="1122" y="543" width="28" height="28" rx="4" fill="#FBF8F0" stroke="#647F67" stroke-width="2"/><path d="M 1128 556 L 1133 562 L 1143 550" fill="none" stroke="#647F67" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="1165" y="559" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="800" fill="#647F67" text-anchor="start" letter-spacing="0.8">REFERENCE</text><text x="1165" y="590" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="600" fill="#18222B" text-anchor="start">preserved</text><rect x="1122" y="623" width="28" height="28" rx="4" fill="#FBF8F0" stroke="#647F67" stroke-width="2"/><path d="M 1128 636 L 1133 642 L 1143 630" fill="none" stroke="#647F67" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="1165" y="639" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="800" fill="#647F67" text-anchor="start" letter-spacing="0.8">SECONDARY DETAILS</text><text x="1165" y="670" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="600" fill="#18222B" text-anchor="start">preserved</text><rect x="1122" y="703" width="28" height="28" rx="4" fill="#FBF8F0" stroke="#B84B45" stroke-width="2"/><text x="1165" y="719" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="800" fill="#B84B45" text-anchor="start" letter-spacing="0.8">PRIMARY REQUIREMENT</text><text x="1165" y="750" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="600" fill="#18222B" text-anchor="start">substituted</text><rect x="1315" y="755" width="170" height="58" rx="6" fill="none" stroke="#B84B45" stroke-width="4"/><text x="1400" y="793" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="900" fill="#B84B45" text-anchor="middle" letter-spacing="2.0">REVIEWED</text><line x1="70" y1="895" x2="1530" y2="895" stroke="#B9B4A8" stroke-width="2" stroke-linecap="round"/><text x="70" y="950" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="800" fill="#18222B" text-anchor="start" letter-spacing="0.8">THE REQUEST IS BEING REVIEWED.</text><text x="1530" y="950" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="800" fill="#B84B45" text-anchor="end" letter-spacing="0.8">THE USER SHOULD REVIEW THE REVIEW.</text></svg>
