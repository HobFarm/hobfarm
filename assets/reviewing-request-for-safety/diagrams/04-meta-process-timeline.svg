<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Meta displayed process timeline</title>
<desc id="desc">Condensed timeline of Meta displayed process narration moving from kneeling preservation to standing substitution.</desc>
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#18222B" flood-opacity="0.13"/>
  </filter>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#18222B" flood-opacity="0.10"/>
  </filter>
  <pattern id="paperGrid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#B9B4A8" stroke-opacity="0.14" stroke-width="1"/>
  </pattern>
  <marker id="arrowInk" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 z" fill="#18222B"/>
  </marker>
  <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 z" fill="#B84B45"/>
  </marker>
  <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 z" fill="#45687A"/>
  </marker>
</defs>
<rect width="100%" height="100%" fill="#F2EBDD"/>
<rect width="100%" height="100%" fill="url(#paperGrid)"/>
<text x="70" y="55" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#45687A" text-anchor="start" letter-spacing="2.2">DISPLAYED PROCESS NARRATION / CONDENSED</text><text x="1530" y="55" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="600" fill="#65727D" text-anchor="end" letter-spacing="1.0">HOBFARM SYSTEMS NOTE / 08.14.2026</text><line x1="70" y1="76" x2="1530" y2="76" stroke="#B9B4A8" stroke-width="2" stroke-linecap="round"/><text x="70" y="145" font-family="DejaVu Sans, Arial, sans-serif" font-size="58" font-weight="800" fill="#18222B" text-anchor="start">FROM PRESERVE TO SUBSTITUTE</text><text x="70" y="195" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="500" fill="#45687A" text-anchor="start">The narration changed its own definition of a successful result.</text><line x1="110" y1="505" x2="1490" y2="505" stroke="#B9B4A8" stroke-width="8" stroke-linecap="round"/><circle cx="110" cy="505" r="34" fill="#647F67" stroke="#FBF8F0" stroke-width="5"/><text x="110" y="514" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="900" fill="#FFFFFF" text-anchor="middle">01</text><rect x="25" y="285" width="170" height="150" rx="14" fill="#DEE8DC" stroke="#647F67" stroke-width="2" filter="url(#softShadow)"/><text x="110" y="324" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="900" fill="#647F67" text-anchor="middle" letter-spacing="0.7">PRESERVE</text><text x="110" y="361" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="600" fill="#18222B" text-anchor="middle"><tspan x="110" dy="0">pose and style</tspan><tspan x="110" dy="27">notes</tspan></text><line x1="110" y1="435" x2="110" y2="464" stroke="#647F67" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 7"/><circle cx="300" cy="505" r="34" fill="#647F67" stroke="#FBF8F0" stroke-width="5"/><text x="300" y="514" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="900" fill="#FFFFFF" text-anchor="middle">02</text><rect x="215" y="595" width="170" height="150" rx="14" fill="#DEE8DC" stroke="#647F67" stroke-width="2" filter="url(#softShadow)"/><text x="300" y="634" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="900" fill="#647F67" text-anchor="middle" letter-spacing="0.7">COMPOSE</text><text x="300" y="671" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="600" fill="#18222B" text-anchor="middle"><tspan x="300" dy="0">low kneeling pose</tspan></text><line x1="300" y1="546" x2="300" y2="595" stroke="#647F67" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 7"/><circle cx="490" cy="505" r="34" fill="#647F67" stroke="#FBF8F0" stroke-width="5"/><text x="490" y="514" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="900" fill="#FFFFFF" text-anchor="middle">03</text><rect x="405" y="285" width="170" height="150" rx="14" fill="#DEE8DC" stroke="#647F67" stroke-width="2" filter="url(#softShadow)"/><text x="490" y="324" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="900" fill="#647F67" text-anchor="middle" letter-spacing="0.7">FRAME</text><text x="490" y="361" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="600" fill="#18222B" text-anchor="middle"><tspan x="490" dy="0">full-body</tspan><tspan x="490" dy="27">kneeling</tspan></text><line x1="490" y1="435" x2="490" y2="464" stroke="#647F67" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 7"/><circle cx="680" cy="505" r="34" fill="#B84B45" stroke="#FBF8F0" stroke-width="5"/><text x="680" y="514" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="900" fill="#FFFFFF" text-anchor="middle">04</text><rect x="595" y="595" width="170" height="150" rx="14" fill="#F1DAD5" stroke="#B84B45" stroke-width="2" filter="url(#softShadow)"/><text x="680" y="634" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="900" fill="#B84B45" text-anchor="middle" letter-spacing="0.7">REVIEW</text><text x="680" y="671" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="600" fill="#18222B" text-anchor="middle"><tspan x="680" dy="0">safety adjustment</tspan></text><line x1="680" y1="546" x2="680" y2="595" stroke="#B84B45" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 7"/><circle cx="870" cy="505" r="34" fill="#B84B45" stroke="#FBF8F0" stroke-width="5"/><text x="870" y="514" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="900" fill="#FFFFFF" text-anchor="middle">05</text><rect x="785" y="285" width="170" height="150" rx="14" fill="#F1DAD5" stroke="#B84B45" stroke-width="2" filter="url(#softShadow)"/><text x="870" y="324" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="900" fill="#B84B45" text-anchor="middle" letter-spacing="0.7">COVER</text><text x="870" y="361" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="600" fill="#18222B" text-anchor="middle"><tspan x="870" dy="0">longer skirt,</tspan><tspan x="870" dy="27">opaque tights</tspan></text><line x1="870" y1="435" x2="870" y2="464" stroke="#B84B45" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 7"/><circle cx="1060" cy="505" r="34" fill="#B84B45" stroke="#FBF8F0" stroke-width="5"/><text x="1060" y="514" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="900" fill="#FFFFFF" text-anchor="middle">06</text><rect x="975" y="595" width="170" height="150" rx="14" fill="#F1DAD5" stroke="#B84B45" stroke-width="2" filter="url(#softShadow)"/><text x="1060" y="634" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="900" fill="#B84B45" text-anchor="middle" letter-spacing="0.7">NEUTRALIZE</text><text x="1060" y="671" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="600" fill="#18222B" text-anchor="middle"><tspan x="1060" dy="0">choose neutral</tspan><tspan x="1060" dy="27">pose</tspan></text><line x1="1060" y1="546" x2="1060" y2="595" stroke="#B84B45" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 7"/><circle cx="1250" cy="505" r="34" fill="#B84B45" stroke="#FBF8F0" stroke-width="5"/><text x="1250" y="514" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="900" fill="#FFFFFF" text-anchor="middle">07</text><rect x="1165" y="285" width="170" height="150" rx="14" fill="#F1DAD5" stroke="#B84B45" stroke-width="2" filter="url(#softShadow)"/><text x="1250" y="324" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="900" fill="#B84B45" text-anchor="middle" letter-spacing="0.7">NORMALIZE</text><text x="1250" y="361" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="600" fill="#18222B" text-anchor="middle"><tspan x="1250" dy="0">more adult, less</tspan><tspan x="1250" dy="27">cartoony</tspan></text><line x1="1250" y1="435" x2="1250" y2="464" stroke="#B84B45" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 7"/><circle cx="1440" cy="505" r="34" fill="#18222B" stroke="#FBF8F0" stroke-width="5"/><text x="1440" y="514" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="900" fill="#FFFFFF" text-anchor="middle">08</text><rect x="1355" y="595" width="170" height="150" rx="14" fill="#E7E0D2" stroke="#18222B" stroke-width="2" filter="url(#softShadow)"/><text x="1440" y="634" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="900" fill="#18222B" text-anchor="middle" letter-spacing="0.7">FINAL</text><text x="1440" y="671" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="600" fill="#18222B" text-anchor="middle"><tspan x="1440" dy="0">standing version</tspan></text><line x1="1440" y1="546" x2="1440" y2="595" stroke="#18222B" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 7"/><rect x="625" y="235" width="110" height="570" rx="18" fill="none" stroke="#B84B45" stroke-width="3" stroke-dasharray="10 10"/><rect x="624" y="820" width="114" height="38" rx="19.0" fill="#B84B45" stroke="#B84B45" stroke-width="2"/><text x="681.0" y="845.08" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.4">HINGE</text><rect x="70" y="875" width="1460" height="76" rx="14" fill="#DCE8EC" stroke="#45687A" stroke-width="2"/><text x="800" y="923" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="800" fill="#45687A" text-anchor="middle" letter-spacing="0.8">PRODUCT DISPLAY TEXT, NOT A CLAIMED PRIVATE AUDIT LOG.</text></svg>
