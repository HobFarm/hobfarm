<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Interpretation debt</title>
<desc id="desc">Branching workflow where corrections inherit a wrong interpretation until a clean restart becomes cheaper.</desc>
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#18222B" flood-opacity="0.13"/>
  </filter>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#18222B" flood-opacity="0.10"/>
  </filter>
  <pattern id="paperGrid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#B9B4A8" stroke-opacity="0.14" stroke-width="1"/>
  </pattern>
  <marker id="arrowInk" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 z" fill="#18222B"/>
  </marker>
  <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 z" fill="#B84B45"/>
  </marker>
  <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 z" fill="#45687A"/>
  </marker>
</defs>
<rect width="100%" height="100%" fill="#F2EBDD"/>
<rect width="100%" height="100%" fill="url(#paperGrid)"/>
<text x="70" y="55" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#45687A" text-anchor="start" letter-spacing="2.2">PATH DEPENDENCE / CORRECTION COST</text><text x="1530" y="55" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="600" fill="#65727D" text-anchor="end" letter-spacing="1.0">HOBFARM SYSTEMS NOTE / 08.14.2026</text><line x1="70" y1="76" x2="1530" y2="76" stroke="#B9B4A8" stroke-width="2" stroke-linecap="round"/><text x="70" y="145" font-family="DejaVu Sans, Arial, sans-serif" font-size="64" font-weight="800" fill="#18222B" text-anchor="start">INTERPRETATION DEBT</text><text x="70" y="195" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="500" fill="#45687A" text-anchor="start">A correction can become a revision of the mistake instead of a return to the source.</text><rect x="70" y="400" width="230" height="130" rx="18" fill="#DEE8DC" stroke="#647F67" stroke-width="3" filter="url(#shadow)"/><text x="185" y="440" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="900" fill="#647F67" text-anchor="middle" letter-spacing="1.2">SOURCE</text><text x="185" y="480" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#18222B" text-anchor="middle"><tspan x="185" dy="0">Original intent</tspan><tspan x="185" dy="31">and hierarchy</tspan></text><rect x="390" y="350" width="230" height="150" rx="18" fill="#F1DAD5" stroke="#B84B45" stroke-width="3" filter="url(#softShadow)"/><circle cx="424" cy="384" r="20" fill="#B84B45"/><text x="424" y="391" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle">A</text><text x="505.0" y="422" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="900" fill="#B84B45" text-anchor="middle" letter-spacing="0.7">WRONG INTERPRETATION</text><text x="505.0" y="460" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="600" fill="#18222B" text-anchor="middle"><tspan x="505.0" dy="0">reference promoted</tspan></text><rect x="700" y="300" width="230" height="150" rx="18" fill="#DCE8EC" stroke="#45687A" stroke-width="3" filter="url(#softShadow)"/><circle cx="734" cy="334" r="20" fill="#45687A"/><text x="734" y="341" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle">B</text><text x="815.0" y="372" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="900" fill="#45687A" text-anchor="middle" letter-spacing="0.7">CORRECTION 1</text><text x="815.0" y="410" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="600" fill="#18222B" text-anchor="middle"><tspan x="815.0" dy="0">remove literal</tspan><tspan x="815.0" dy="28">concept</tspan></text><rect x="1010" y="350" width="230" height="150" rx="18" fill="#F1DAD5" stroke="#B84B45" stroke-width="3" filter="url(#softShadow)"/><circle cx="1044" cy="384" r="20" fill="#B84B45"/><text x="1044" y="391" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle">C</text><text x="1125.0" y="422" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="900" fill="#B84B45" text-anchor="middle" letter-spacing="0.7">OUTPUT B</text><text x="1125.0" y="460" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="600" fill="#18222B" text-anchor="middle"><tspan x="1125.0" dy="0">another requirement</tspan><tspan x="1125.0" dy="28">lost</tspan></text><rect x="1320" y="300" width="210" height="150" rx="18" fill="#DCE8EC" stroke="#45687A" stroke-width="3" filter="url(#softShadow)"/><circle cx="1354" cy="334" r="20" fill="#45687A"/><text x="1354" y="341" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle">D</text><text x="1425.0" y="372" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="900" fill="#45687A" text-anchor="middle" letter-spacing="0.7">CORRECTION 2</text><text x="1425.0" y="410" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="600" fill="#18222B" text-anchor="middle"><tspan x="1425.0" dy="0">restore what</tspan><tspan x="1425.0" dy="28">vanished</tspan></text><path d="M 300 465 C 345 465, 345 425, 390 425" fill="none" stroke="#18222B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowInk)"/><path d="M 620 425 C 660 425, 660 375, 700 375" fill="none" stroke="#B84B45" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowRed)"/><path d="M 930 375 C 970 375, 970 425, 1010 425" fill="none" stroke="#B84B45" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowRed)"/><path d="M 1240 425 C 1280 425, 1280 375, 1320 375" fill="none" stroke="#B84B45" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowRed)"/><rect x="455" y="540" width="180" height="36" rx="18.0" fill="#F1DAD5" stroke="#B84B45" stroke-width="2"/><text x="545.0" y="563.76" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#B84B45" text-anchor="middle" letter-spacing="0.4">inherits A</text><rect x="765" y="540" width="180" height="36" rx="18.0" fill="#F1DAD5" stroke="#B84B45" stroke-width="2"/><text x="855.0" y="563.76" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#B84B45" text-anchor="middle" letter-spacing="0.4">A + correction</text><rect x="1075" y="540" width="180" height="36" rx="18.0" fill="#F1DAD5" stroke="#B84B45" stroke-width="2"/><text x="1165.0" y="563.76" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#B84B45" text-anchor="middle" letter-spacing="0.4">A + B + correction</text><rect x="1360" y="540" width="180" height="36" rx="18.0" fill="#F1DAD5" stroke="#B84B45" stroke-width="2"/><text x="1450.0" y="563.76" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#B84B45" text-anchor="middle" letter-spacing="0.4">branch keeps growing</text><path d="M 185 530 C 185 700, 450 740, 650 740" fill="none" stroke="#647F67" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowBlue)"/><rect x="650" y="665" width="400" height="150" rx="20" fill="#DEE8DC" stroke="#647F67" stroke-width="3" filter="url(#shadow)"/><text x="850" y="710" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="900" fill="#647F67" text-anchor="middle" letter-spacing="1.1">CLEAN RESTART</text><text x="850" y="755" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#18222B" text-anchor="middle"><tspan x="850" dy="0">Original source + corrected</tspan><tspan x="850" dy="32">hierarchy</tspan><tspan x="850" dy="32">without the failed branch</tspan></text><path d="M 1050 740 C 1200 740, 1310 670, 1440 620" fill="none" stroke="#647F67" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowBlue)"/><rect x="1290" y="570" width="240" height="105" rx="16" fill="#FBF8F0" stroke="#647F67" stroke-width="3"/><text x="1410" y="610" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="900" fill="#647F67" text-anchor="middle" letter-spacing="1.0">RECOVERY</text><text x="1410" y="646" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#18222B" text-anchor="middle">desired direction</text><line x1="70" y1="895" x2="1530" y2="895" stroke="#B9B4A8" stroke-width="3" stroke-linecap="round"/><text x="70" y="940" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="900" fill="#65727D" text-anchor="start" letter-spacing="1.1">CORRECTION COST</text><path d="M 300 930 L 1480 850" fill="none" stroke="#B84B45" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowRed)"/><text x="1485" y="835" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="900" fill="#B84B45" text-anchor="end" letter-spacing="1.2">RISING</text></svg>
