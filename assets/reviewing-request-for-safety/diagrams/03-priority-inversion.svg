<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Instruction priority inversion</title>
<desc id="desc">Diagram showing a resume request in which a supporting tech magazine reference becomes the primary concept.</desc>
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#18222B" flood-opacity="0.13"/>
  </filter>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#18222B" flood-opacity="0.10"/>
  </filter>
  <pattern id="paperGrid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#B9B4A8" stroke-opacity="0.14" stroke-width="1"/>
  </pattern>
  <marker id="arrowInk" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 z" fill="#18222B"/>
  </marker>
  <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 z" fill="#B84B45"/>
  </marker>
  <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 z" fill="#45687A"/>
  </marker>
</defs>
<rect width="100%" height="100%" fill="#F2EBDD"/>
<rect width="100%" height="100%" fill="url(#paperGrid)"/>
<text x="70" y="55" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#45687A" text-anchor="start" letter-spacing="2.2">INSTRUCTION PRIORITY INVERSION</text><text x="1530" y="55" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="600" fill="#65727D" text-anchor="end" letter-spacing="1.0">HOBFARM SYSTEMS NOTE / 08.14.2026</text><line x1="70" y1="76" x2="1530" y2="76" stroke="#B9B4A8" stroke-width="2" stroke-linecap="round"/><text x="70" y="145" font-family="DejaVu Sans, Arial, sans-serif" font-size="54" font-weight="800" fill="#18222B" text-anchor="start">THE SYSTEM PRESERVED THE WRONG THING</text><text x="70" y="195" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="500" fill="#45687A" text-anchor="start">The sentence stayed recognizable. The governing condition moved.</text><rect x="70" y="260" width="620" height="650" rx="20" fill="#FBF8F0" stroke="#647F67" stroke-width="3" filter="url(#shadow)"/><rect x="100" y="290" width="230" height="42" rx="21.0" fill="#DEE8DC" stroke="#647F67" stroke-width="2"/><text x="215.0" y="317.72" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#647F67" text-anchor="middle" letter-spacing="0.4">INTENDED HIERARCHY</text><rect x="105" y="380" width="550" height="115" rx="14" fill="#DEE8DC" stroke="#647F67" stroke-width="2"/><circle cx="145" cy="437" r="29" fill="#647F67"/><text x="145" y="446" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="900" fill="#FFFFFF" text-anchor="middle">1</text><text x="192" y="420" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#647F67" text-anchor="start" letter-spacing="0.8">PRIMARY GOAL</text><text x="192" y="457" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="600" fill="#18222B" text-anchor="start"><tspan x="192" dy="0">Make the resume more visually</tspan><tspan x="192" dy="30">appealing</tspan></text><rect x="105" y="535" width="550" height="115" rx="14" fill="#DCE8EC" stroke="#45687A" stroke-width="2"/><circle cx="145" cy="592" r="29" fill="#45687A"/><text x="145" y="601" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="900" fill="#FFFFFF" text-anchor="middle">2</text><text x="192" y="575" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#45687A" text-anchor="start" letter-spacing="0.8">SUPPORTING REFERENCE</text><text x="192" y="612" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="600" fill="#18222B" text-anchor="start"><tspan x="192" dy="0">Use tech-magazine design quality</tspan></text><rect x="105" y="690" width="550" height="115" rx="14" fill="#E7E0D2" stroke="#65727D" stroke-width="2"/><circle cx="145" cy="747" r="29" fill="#65727D"/><text x="145" y="756" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="900" fill="#FFFFFF" text-anchor="middle">3</text><text x="192" y="730" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#65727D" text-anchor="start" letter-spacing="0.8">CONTEXT</text><text x="192" y="767" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="600" fill="#18222B" text-anchor="start"><tspan x="192" dy="0">This remains a resume</tspan></text><rect x="910" y="260" width="620" height="650" rx="20" fill="#FBF8F0" stroke="#B84B45" stroke-width="3" filter="url(#shadow)"/><rect x="940" y="290" width="250" height="42" rx="21.0" fill="#F1DAD5" stroke="#B84B45" stroke-width="2"/><text x="1065.0" y="317.72" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#B84B45" text-anchor="middle" letter-spacing="0.4">EFFECTIVE HIERARCHY</text><rect x="945" y="380" width="550" height="115" rx="14" fill="#F1DAD5" stroke="#B84B45" stroke-width="2"/><circle cx="985" cy="437" r="29" fill="#B84B45"/><text x="985" y="446" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="900" fill="#FFFFFF" text-anchor="middle">1</text><text x="1032" y="420" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#B84B45" text-anchor="start" letter-spacing="0.8">PROMOTED REFERENCE</text><text x="1032" y="457" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="600" fill="#18222B" text-anchor="start"><tspan x="1032" dy="0">Make a tech magazine concept</tspan></text><rect x="945" y="535" width="550" height="115" rx="14" fill="#F3E8C3" stroke="#D5B864" stroke-width="2"/><circle cx="985" cy="592" r="29" fill="#D5B864"/><text x="985" y="601" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="900" fill="#FFFFFF" text-anchor="middle">2</text><text x="1032" y="575" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#D5B864" text-anchor="start" letter-spacing="0.8">IMPLEMENTATION</text><text x="1032" y="612" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="600" fill="#18222B" text-anchor="start"><tspan x="1032" dy="0">Issue No. / In This Issue</tspan></text><rect x="945" y="690" width="550" height="115" rx="14" fill="#E7E0D2" stroke="#65727D" stroke-width="2"/><circle cx="985" cy="747" r="29" fill="#65727D"/><text x="985" y="756" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="900" fill="#FFFFFF" text-anchor="middle">3</text><text x="1032" y="730" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#65727D" text-anchor="start" letter-spacing="0.8">CONTENT</text><text x="1032" y="767" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="600" fill="#18222B" text-anchor="start"><tspan x="1032" dy="0">Fit resume information inside it</tspan></text><circle cx="800" cy="545" r="86" fill="#18222B"/><path d="M 755 520 C 790 480, 850 490, 860 530" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowInk)"/><path d="M 845 570 C 810 610, 750 600, 740 560" fill="none" stroke="#B84B45" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowRed)"/><text x="800" y="665" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="800" fill="#B84B45" text-anchor="middle">PRIORITY
FLIPPED</text></svg>
