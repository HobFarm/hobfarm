<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">AI interpretation stack</title>
<desc id="desc">Functional stack of possible product layers between user intent and user-visible AI output.</desc>
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#18222B" flood-opacity="0.13"/>
  </filter>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#18222B" flood-opacity="0.10"/>
  </filter>
  <pattern id="paperGrid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#B9B4A8" stroke-opacity="0.14" stroke-width="1"/>
  </pattern>
  <marker id="arrowInk" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 z" fill="#18222B"/>
  </marker>
  <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 z" fill="#B84B45"/>
  </marker>
  <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 z" fill="#45687A"/>
  </marker>
</defs>
<rect width="100%" height="100%" fill="#F2EBDD"/>
<rect width="100%" height="100%" fill="url(#paperGrid)"/>
<text x="70" y="55" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#45687A" text-anchor="start" letter-spacing="2.2">FUNCTIONAL MODEL / NOT PRIVATE ARCHITECTURE</text><text x="1530" y="55" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="600" fill="#65727D" text-anchor="end" letter-spacing="1.0">HOBFARM SYSTEMS NOTE / 08.14.2026</text><line x1="70" y1="76" x2="1530" y2="76" stroke="#B9B4A8" stroke-width="2" stroke-linecap="round"/><text x="70" y="145" font-family="DejaVu Sans, Arial, sans-serif" font-size="56" font-weight="800" fill="#18222B" text-anchor="start">THE AI BETWEEN YOU AND THE AI</text><text x="70" y="195" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="500" fill="#45687A" text-anchor="start">A user-facing product can contain more than a model and a prompt.</text><rect x="1090" y="120" width="440" height="105" rx="16" fill="#FBF8F0" stroke="#B9B4A8" stroke-width="2"/><text x="1120" y="155" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="800" fill="#65727D" text-anchor="start" letter-spacing="1.0">COMMON MENTAL MODEL</text><text x="1120" y="200" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="25" font-weight="800" fill="#18222B" text-anchor="start">USER  -&gt;  AI  -&gt;  OUTPUT</text><rect x="270" y="255" width="920" height="52" rx="11" fill="#DEE8DC" stroke="#647F67" stroke-width="2" filter="url(#softShadow)"/><circle cx="298" cy="281" r="17" fill="#647F67"/><text x="298" y="287" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle">01</text><text x="328" y="288" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="900" fill="#647F67" text-anchor="start" letter-spacing="0.7">USER INTENT</text><text x="1166" y="288" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#18222B" text-anchor="end">request, files, voice, images</text><line x1="800" y1="308" x2="800" y2="320" stroke="#18222B" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowInk)"/><rect x="288" y="321" width="902" height="52" rx="11" fill="#DCE8EC" stroke="#45687A" stroke-width="2"/><circle cx="316" cy="347" r="17" fill="#45687A"/><text x="316" y="353" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle">02</text><text x="346" y="354" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="900" fill="#45687A" text-anchor="start" letter-spacing="0.7">CONVERSATION STATE</text><text x="1166" y="354" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#18222B" text-anchor="end">thread, memory, retrieved context</text><line x1="800" y1="374" x2="800" y2="386" stroke="#18222B" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowInk)"/><rect x="270" y="387" width="884" height="52" rx="11" fill="#F3E8C3" stroke="#D5B864" stroke-width="2"/><circle cx="298" cy="413" r="17" fill="#D5B864"/><text x="298" y="419" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle">03</text><text x="328" y="420" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="900" fill="#D5B864" text-anchor="start" letter-spacing="0.7">INSTRUCTION HIERARCHY</text><text x="1130" y="420" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#18222B" text-anchor="end">system, developer, user, tools</text><line x1="800" y1="440" x2="800" y2="452" stroke="#18222B" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowInk)"/><rect x="288" y="453" width="920" height="52" rx="11" fill="#F1DAD5" stroke="#B84B45" stroke-width="2"/><circle cx="316" cy="479" r="17" fill="#B84B45"/><text x="316" y="485" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle">04</text><text x="346" y="486" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="900" fill="#B84B45" text-anchor="start" letter-spacing="0.7">PROMPT TRANSFORMATION</text><text x="1184" y="486" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#18222B" text-anchor="end">rewrite, expand, optimize, summarize</text><line x1="800" y1="506" x2="800" y2="518" stroke="#18222B" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowInk)"/><rect x="270" y="519" width="902" height="52" rx="11" fill="#F1DAD5" stroke="#B84B45" stroke-width="2"/><circle cx="298" cy="545" r="17" fill="#B84B45"/><text x="298" y="551" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle">05</text><text x="328" y="552" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="900" fill="#B84B45" text-anchor="start" letter-spacing="0.7">POLICY AND SAFEGUARDS</text><text x="1148" y="552" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#18222B" text-anchor="end">input and output review</text><line x1="800" y1="572" x2="800" y2="584" stroke="#18222B" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowInk)"/><rect x="288" y="585" width="884" height="52" rx="11" fill="#DCE8EC" stroke="#45687A" stroke-width="2"/><circle cx="316" cy="611" r="17" fill="#45687A"/><text x="316" y="617" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle">06</text><text x="346" y="618" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="900" fill="#45687A" text-anchor="start" letter-spacing="0.7">MODEL AND TOOL ROUTING</text><text x="1148" y="618" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#18222B" text-anchor="end">model choice, search, code, media</text><line x1="800" y1="638" x2="800" y2="650" stroke="#18222B" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowInk)"/><rect x="270" y="651" width="920" height="52" rx="11" fill="#DEE8DC" stroke="#647F67" stroke-width="2"/><circle cx="298" cy="677" r="17" fill="#647F67"/><text x="298" y="683" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle">07</text><text x="328" y="684" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="900" fill="#647F67" text-anchor="start" letter-spacing="0.7">GENERATION</text><text x="1166" y="684" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#18222B" text-anchor="end">text, image, video, code</text><line x1="800" y1="704" x2="800" y2="716" stroke="#18222B" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowInk)"/><rect x="288" y="717" width="902" height="52" rx="11" fill="#F1DAD5" stroke="#B84B45" stroke-width="2"/><circle cx="316" cy="743" r="17" fill="#B84B45"/><text x="316" y="749" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle">08</text><text x="346" y="750" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="900" fill="#B84B45" text-anchor="start" letter-spacing="0.7">EVALUATION / REGENERATION</text><text x="1166" y="750" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#18222B" text-anchor="end">score, select, edit, retry</text><line x1="800" y1="770" x2="800" y2="782" stroke="#18222B" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowInk)"/><rect x="270" y="783" width="884" height="52" rx="11" fill="#DCE8EC" stroke="#45687A" stroke-width="2"/><circle cx="298" cy="809" r="17" fill="#45687A"/><text x="298" y="815" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle">09</text><text x="328" y="816" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="900" fill="#45687A" text-anchor="start" letter-spacing="0.7">PRODUCT PRESENTATION</text><text x="1130" y="816" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#18222B" text-anchor="end">status text, explanation, UI</text><line x1="800" y1="836" x2="800" y2="848" stroke="#18222B" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowInk)"/><rect x="288" y="849" width="920" height="52" rx="11" fill="#E7E0D2" stroke="#18222B" stroke-width="2" filter="url(#softShadow)"/><circle cx="316" cy="875" r="17" fill="#18222B"/><text x="316" y="881" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle">10</text><text x="346" y="882" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="900" fill="#18222B" text-anchor="start" letter-spacing="0.7">USER-VISIBLE OUTPUT</text><text x="1184" y="882" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#18222B" text-anchor="end">what the user receives</text><rect x="1250" y="300" width="280" height="480" rx="18" fill="#FBF8F0" stroke="#45687A" stroke-width="2"/><text x="1280" y="345" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="900" fill="#45687A" text-anchor="start" letter-spacing="1.2">READ THIS CAREFULLY</text><text x="1280" y="395" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="600" fill="#18222B" text-anchor="start"><tspan x="1280" dy="0">Not every product uses</tspan><tspan x="1280" dy="31">every layer. The order</tspan><tspan x="1280" dy="31">can differ. Some</tspan><tspan x="1280" dy="31">layers are combined or</tspan><tspan x="1280" dy="31">invisible.</tspan></text><line x1="1280" y1="575" x2="1500" y2="575" stroke="#B9B4A8" stroke-width="2" stroke-linecap="round"/><text x="1280" y="625" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="600" fill="#65727D" text-anchor="start"><tspan x="1280" dy="0">The diagram names</tspan><tspan x="1280" dy="29">functional</tspan><tspan x="1280" dy="29">possibilities. It does</tspan><tspan x="1280" dy="29">not reverse-engineer</tspan><tspan x="1280" dy="29">Meta, Claude, ChatGPT,</tspan><tspan x="1280" dy="29">Gemini, or Grok.</tspan></text></svg>
