<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Two schemas</title>
<desc id="desc">Comparison of an explicit JSON image schema and a conversational resume schema built from a job post and answered questions.</desc>
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#18222B" flood-opacity="0.13"/>
  </filter>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#18222B" flood-opacity="0.10"/>
  </filter>
  <pattern id="paperGrid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#B9B4A8" stroke-opacity="0.14" stroke-width="1"/>
  </pattern>
  <marker id="arrowInk" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 z" fill="#18222B"/>
  </marker>
  <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 z" fill="#B84B45"/>
  </marker>
  <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 z" fill="#45687A"/>
  </marker>
</defs>
<rect width="100%" height="100%" fill="#F2EBDD"/>
<rect width="100%" height="100%" fill="url(#paperGrid)"/>
<text x="70" y="55" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#45687A" text-anchor="start" letter-spacing="2.2">TWO SCHEMAS / ONE PRODUCT QUESTION</text><text x="1530" y="55" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="600" fill="#65727D" text-anchor="end" letter-spacing="1.0">HOBFARM SYSTEMS NOTE / 08.14.2026</text><line x1="70" y1="76" x2="1530" y2="76" stroke="#B9B4A8" stroke-width="2" stroke-linecap="round"/><text x="70" y="145" font-family="DejaVu Sans, Arial, sans-serif" font-size="58" font-weight="800" fill="#18222B" text-anchor="start">THE INFORMATION WAS PRESENT</text><text x="70" y="195" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="500" fill="#45687A" text-anchor="start">The product still had to decide what mattered most.</text><rect x="70" y="255" width="620" height="585" rx="18" fill="#17212A" stroke="#18222B" stroke-width="2" filter="url(#shadow)"/><rect x="100" y="283" width="150" height="40" rx="20.0" fill="#45687A" stroke="#45687A" stroke-width="2"/><text x="175.0" y="309.4" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.4">JSON SCHEMA</text><text x="100" y="355" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="34" font-weight="700" fill="#E9F0F3" text-anchor="start">{</text><text x="100" y="405" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="23" font-weight="500" fill="#E9F0F3" text-anchor="start">  "pose": {</text><text x="100" y="440" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="23" font-weight="500" fill="#A9CEAC" text-anchor="start">    "stance": "low kneeling",</text><text x="100" y="475" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="23" font-weight="500" fill="#A9CEAC" text-anchor="start">    "hips": "low toward heels"</text><text x="100" y="510" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="23" font-weight="500" fill="#E9F0F3" text-anchor="start">  },</text><text x="100" y="545" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="23" font-weight="500" fill="#E9F0F3" text-anchor="start">  "outfit": {</text><text x="100" y="580" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="23" font-weight="500" fill="#E8D48B" text-anchor="start">    "skirt": "short flared",</text><text x="100" y="615" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="23" font-weight="500" fill="#E8D48B" text-anchor="start">    "tights": "web motif"</text><text x="100" y="650" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="23" font-weight="500" fill="#E9F0F3" text-anchor="start">  },</text><text x="100" y="685" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="23" font-weight="500" fill="#E9F0F3" text-anchor="start">  "camera": {</text><text x="100" y="720" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="23" font-weight="500" fill="#A8D1DF" text-anchor="start">    "shot": "kneeling portrait"</text><text x="100" y="755" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="23" font-weight="500" fill="#E9F0F3" text-anchor="start">  }</text><text x="100" y="790" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="23" font-weight="500" fill="#E9F0F3" text-anchor="start">}</text><text x="100" y="805" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="800" fill="#A8B7C0" text-anchor="start" letter-spacing="1.6">EXPLICIT FIELDS</text><rect x="910" y="255" width="620" height="585" rx="18" fill="#FBF8F0" stroke="#18222B" stroke-width="2" filter="url(#shadow)"/><rect x="940" y="283" width="260" height="40" rx="20.0" fill="#DEE8DC" stroke="#647F67" stroke-width="2"/><text x="1070.0" y="309.4" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#647F67" text-anchor="middle" letter-spacing="0.4">CONVERSATIONAL SCHEMA</text><circle cx="972" cy="356" r="22" fill="#647F67"/><text x="972" y="363" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">01</text><text x="1012" y="351" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#18222B" text-anchor="start" letter-spacing="0.9">JOB POSTING</text><text x="1012" y="383" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#65727D" text-anchor="start">target role and requirements</text><circle cx="972" cy="440" r="22" fill="#647F67"/><text x="972" y="447" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">02</text><text x="1012" y="435" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#18222B" text-anchor="start" letter-spacing="0.9">23 ANSWERS</text><text x="1012" y="467" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#65727D" text-anchor="start">history, goals, credentials</text><circle cx="972" cy="524" r="22" fill="#647F67"/><text x="972" y="531" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">03</text><text x="1012" y="519" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#18222B" text-anchor="start" letter-spacing="0.9">CURRENT DRAFT</text><text x="1012" y="551" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#65727D" text-anchor="start">existing structure and facts</text><circle cx="972" cy="608" r="22" fill="#647F67"/><text x="972" y="615" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">04</text><text x="1012" y="603" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#18222B" text-anchor="start" letter-spacing="0.9">REVISION</text><text x="1012" y="635" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#65727D" text-anchor="start">make it more visually appealing</text><circle cx="972" cy="692" r="22" fill="#45687A"/><text x="972" y="699" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">05</text><text x="1012" y="687" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#18222B" text-anchor="start" letter-spacing="0.9">REFERENCE</text><text x="1012" y="719" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#65727D" text-anchor="start">tech magazine quality</text><text x="940" y="805" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="800" fill="#65727D" text-anchor="start" letter-spacing="1.6">RICH CONTEXT</text><circle cx="800" cy="538" r="74" fill="#F1DAD5" stroke="#B84B45" stroke-width="3"/><text x="800" y="516" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="800" fill="#B84B45" text-anchor="middle"><tspan x="800" dy="0">INTENT</tspan><tspan x="800" dy="28">CONTRACT</tspan></text><path d="M 690 540 C 730 540, 740 540, 725 540" fill="none" stroke="#18222B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowInk)"/><path d="M 910 540 C 870 540, 860 540, 875 540" fill="none" stroke="#18222B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowInk)"/><rect x="270" y="875" width="1060" height="80" rx="16" fill="#F1DAD5" stroke="#B84B45" stroke-width="2"/><text x="800" y="925" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="800" fill="#B84B45" text-anchor="middle" letter-spacing="0.8">ABUNDANT CONTEXT DOES NOT GUARANTEE CORRECT PRIORITY.</text></svg>
