<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">From specific intent to AI slop</title>
<desc id="desc">Pipeline showing interpretation, normalization, correction fatigue, acceptance, and publication with a human review gate.</desc>
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#18222B" flood-opacity="0.13"/>
  </filter>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#18222B" flood-opacity="0.10"/>
  </filter>
  <pattern id="paperGrid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#B9B4A8" stroke-opacity="0.14" stroke-width="1"/>
  </pattern>
  <marker id="arrowInk" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 z" fill="#18222B"/>
  </marker>
  <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 z" fill="#B84B45"/>
  </marker>
  <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 z" fill="#45687A"/>
  </marker>
</defs>
<rect width="100%" height="100%" fill="#F2EBDD"/>
<rect width="100%" height="100%" fill="url(#paperGrid)"/>
<text x="70" y="55" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#45687A" text-anchor="start" letter-spacing="2.2">ACCUMULATED INTERPRETATION / HUMAN REVIEW</text><text x="1530" y="55" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="600" fill="#65727D" text-anchor="end" letter-spacing="1.0">HOBFARM SYSTEMS NOTE / 08.14.2026</text><line x1="70" y1="76" x2="1530" y2="76" stroke="#B9B4A8" stroke-width="2" stroke-linecap="round"/><text x="70" y="145" font-family="DejaVu Sans, Arial, sans-serif" font-size="58" font-weight="800" fill="#18222B" text-anchor="start">FROM SPECIFIC TO “GOOD ENOUGH”</text><text x="70" y="195" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="500" fill="#45687A" text-anchor="start">Nothing catastrophic has to happen at any single step.</text><path d="M 70 345.0 L 237 355.0 L 237 585.0 L 70 595.0 Z" fill="#DEE8DC" stroke="#647F67" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="458" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="900" fill="#647F67" text-anchor="start" letter-spacing="0.5">SPECIFIC INTENT</text><text x="80" y="493" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="600" fill="#18222B" text-anchor="start"><tspan x="80" dy="0">weird,</tspan><tspan x="80" dy="24">deliberate,</tspan><tspan x="80" dy="24">personal</tspan></text><path d="M 237 355.0 L 404 365.0 L 404 575.0 L 237 585.0 Z" fill="#DCE8EC" stroke="#45687A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="247" y="458" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="900" fill="#45687A" text-anchor="start" letter-spacing="0.5">INTERPRET</text><text x="247" y="493" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="600" fill="#18222B" text-anchor="start"><tspan x="247" dy="0">system chooses</tspan><tspan x="247" dy="24">meaning</tspan></text><path d="M 404 365.0 L 571 375.0 L 571 565.0 L 404 575.0 Z" fill="#F3E8C3" stroke="#D5B864" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="414" y="458" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="900" fill="#D5B864" text-anchor="start" letter-spacing="0.5">NORMALIZE</text><text x="414" y="493" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="600" fill="#18222B" text-anchor="start"><tspan x="414" dy="0">defaults pull</tspan><tspan x="414" dy="24">toward center</tspan></text><path d="M 571 375.0 L 738 385.0 L 738 555.0 L 571 565.0 Z" fill="#F1DAD5" stroke="#B84B45" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="581" y="458" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="900" fill="#B84B45" text-anchor="start" letter-spacing="0.5">OPTIMIZE</text><text x="581" y="493" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="600" fill="#18222B" text-anchor="start"><tspan x="581" dy="0">polish becomes</tspan><tspan x="581" dy="24">proxy goal</tspan></text><path d="M 738 385.0 L 905 395.0 L 905 545.0 L 738 555.0 Z" fill="#DCE8EC" stroke="#45687A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="748" y="458" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="900" fill="#45687A" text-anchor="start" letter-spacing="0.5">CORRECT</text><text x="748" y="493" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="600" fill="#18222B" text-anchor="start"><tspan x="748" dy="0">user patches the</tspan><tspan x="748" dy="24">branch</tspan></text><path d="M 905 395.0 L 1072 405.0 L 1072 535.0 L 905 545.0 Z" fill="#F1DAD5" stroke="#B84B45" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="915" y="458" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="900" fill="#B84B45" text-anchor="start" letter-spacing="0.5">FATIGUE</text><text x="915" y="493" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="600" fill="#18222B" text-anchor="start"><tspan x="915" dy="0">correction cost</tspan><tspan x="915" dy="24">rises</tspan></text><path d="M 1072 405.0 L 1264 405.0 L 1264 535.0 L 1072 535.0 Z" fill="#E7E0D2" stroke="#18222B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="1082" y="458" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="900" fill="#18222B" text-anchor="start" letter-spacing="0.5">GOOD ENOUGH</text><text x="1082" y="493" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="600" fill="#18222B" text-anchor="start"><tspan x="1082" dy="0">competent, less</tspan><tspan x="1082" dy="24">specific</tspan></text><line x1="1265" y1="300" x2="1265" y2="700" stroke="#18222B" stroke-width="10" stroke-linecap="round"/><rect x="1205" y="330" width="120" height="50" rx="8" fill="#FBF8F0" stroke="#18222B" stroke-width="3"/><text x="1265" y="362" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="900" fill="#18222B" text-anchor="middle" letter-spacing="1.0">REVIEW</text><rect x="1180" y="720" width="170" height="95" rx="14" fill="#FBF8F0" stroke="#647F67" stroke-width="3"/><text x="1265" y="753" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="900" fill="#647F67" text-anchor="middle"><tspan x="1265" dy="0">COMPARE TO</tspan><tspan x="1265" dy="23">ORIGINAL</tspan></text><path d="M 1270 470 L 1375 470" fill="none" stroke="#18222B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowInk)"/><rect x="1380" y="380" width="150" height="180" rx="18" fill="#F1DAD5" stroke="#B84B45" stroke-width="3" filter="url(#shadow)"/><text x="1455" y="430" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="900" fill="#B84B45" text-anchor="middle" letter-spacing="1.0">PUBLISH</text><circle cx="1455" cy="492" r="38" fill="#B84B45"/><path d="M 1437 493 L 1449 505 L 1475 477" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="1455" y="540" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="800" fill="#B84B45" text-anchor="middle" letter-spacing="0.8">SLIPSTREAM</text><path d="M 1265 720 C 1110 850, 780 860, 610 710" fill="none" stroke="#647F67" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowBlue)"/><rect x="705" y="820" width="300" height="42" rx="21.0" fill="#DEE8DC" stroke="#647F67" stroke-width="2"/><text x="855.0" y="847.72" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#647F67" text-anchor="middle" letter-spacing="0.4">REJECT / REVISE / RESTART</text><rect x="70" y="875" width="1460" height="76" rx="14" fill="#18222B" stroke="#18222B" stroke-width="2"/><text x="800" y="923" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="800" fill="#FBF8F0" text-anchor="middle" letter-spacing="0.6">AI CAN NORMALIZE THE WORK. A PERSON STILL DECIDES WHETHER TO SHIP IT.</text></svg>
