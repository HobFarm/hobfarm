    </defs>
<text x="70" y="118" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#9f3f32" text-anchor="start" letter-spacing="1">KEEP THE DURABLE PRODUCTION LAYER LOCAL</text>
