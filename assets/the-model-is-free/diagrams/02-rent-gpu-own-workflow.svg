<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Rent the GPU. Own the Workflow.</title>
<desc id="desc">A local control plane sends bounded jobs to temporary rented GPU capacity, receives results, and terminates compute.</desc>
<rect width="1600" height="1000" fill="#f3eddc"/>
<rect x="26" y="26" width="1548" height="948" rx="6" fill="none" stroke="#202321" stroke-width="4"/>
<line x1="26" y1="136" x2="1574" y2="136" stroke="#202321" stroke-width="3"/>
<text x="70" y="88" font-family="DejaVu Sans, Arial, sans-serif" font-size="48" font-weight="800" letter-spacing="1" fill="#202321">RENT THE GPU. OWN THE WORKFLOW.</text>
<text x="1530" y="86" text-anchor="end" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" fill="#6c6a62">HOBFARM / FIELD DIAGRAM / 2026</text>
<defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#202321"/>
      </marker>
