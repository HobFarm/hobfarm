<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Compute Becomes Boring</title>
<desc id="desc">Television commoditization as a historical analogy, and AI compute as an open question rather than a guaranteed forecast.</desc>
<rect width="1600" height="1000" fill="#f3eddc"/>
<rect x="26" y="26" width="1548" height="948" rx="6" fill="none" stroke="#202321" stroke-width="4"/>
