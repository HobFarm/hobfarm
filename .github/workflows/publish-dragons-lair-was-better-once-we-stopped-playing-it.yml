name: Publish Dragon's Lair is better on YouTube

on:
  schedule:
    - cron: "20 23 23 8 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-dragons-lair-was-better-once-we-stopped-playing-it
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Publish when the scheduled time has arrived
        id: article
        run: node scripts/publish-scheduled-dragons-lair-was-better-once-we-stopped-playing-it.mjs

      - name: Remove the one-time schedule and trigger the production build
        if: steps.article.outputs.published == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-dragons-lair-was-better-once-we-stopped-playing-it.yml
          git rm scripts/publish-scheduled-dragons-lair-was-better-once-we-stopped-playing-it.mjs
          git add src/content/articles/dragons-lair-was-better-once-we-stopped-playing-it.mdx
          git commit -m "Publish Dragon's Lair is better on YouTube"
          git push origin main
