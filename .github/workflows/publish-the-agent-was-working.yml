name: Publish It's so agentic

on:
  schedule:
    - cron: "20 23 27 8 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-the-agent-was-working
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Publish when the scheduled time has arrived
        id: article
        run: node scripts/publish-scheduled-the-agent-was-working.mjs

      - name: Remove the one-time schedule and trigger the production build
        if: steps.article.outputs.published == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-the-agent-was-working.yml
          git rm scripts/publish-scheduled-the-agent-was-working.mjs
          git add src/content/articles/the-agent-was-working.mdx
          git commit -m "Publish It's so agentic"
          git push origin main
