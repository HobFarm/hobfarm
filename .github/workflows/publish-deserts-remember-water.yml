name: Publish Deserts Remember Water

on:
  schedule:
    - cron: "20 23 25 8 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-deserts-remember-water
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Publish when the scheduled time has arrived
        id: article
        run: node scripts/publish-scheduled-deserts-remember-water.mjs

      - name: Remove the one-time schedule and trigger the production build
        if: steps.article.outputs.published == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-deserts-remember-water.yml
          git rm scripts/publish-scheduled-deserts-remember-water.mjs
          git add src/content/articles/deserts-remember-water.mdx
          git commit -m "Publish Deserts Remember Water"
          git push origin main
