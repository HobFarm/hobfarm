name: Publish The Number One Song I've Never Heard

on:
  schedule:
    - cron: "19 23 13 8 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-the-number-one-song
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Publish when the scheduled time has arrived
        id: article
        run: node scripts/publish-scheduled-the-number-one-song.mjs

      - name: Remove the one-time schedule and trigger the production build
        if: steps.article.outputs.published == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-the-number-one-song.yml
          git rm scripts/publish-scheduled-the-number-one-song.mjs
          git add src/content/articles/the-number-one-song-ive-never-heard.mdx
          git commit -m "Publish The Number One Song I've Never Heard"
          git push origin main
