name: Publish Songs We Learned Backwards

on:
  schedule:
    - cron: "20 23 17 8 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-songs-we-learned-backwards
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Publish when the scheduled time has arrived
        id: article
        run: node scripts/publish-scheduled-songs-we-learned-backwards.mjs

      - name: Remove the one-time schedule and trigger the production build
        if: steps.article.outputs.published == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-songs-we-learned-backwards.yml
          git add src/content/articles/songs-we-learned-backwards.mdx
          git commit -m "Publish Songs We Learned Backwards"
          git push origin main
