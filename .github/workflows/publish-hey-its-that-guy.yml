name: Publish Tales from the Crypt Article

on:
  schedule:
    - cron: "25 0 2 8 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-hey-its-that-guy
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Publish when the scheduled time has arrived
        id: article
        run: node scripts/publish-scheduled-hey-its-that-guy.mjs

      - name: Remove the one-time schedule and trigger the production build
        if: steps.article.outputs.published == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-hey-its-that-guy.yml
          git add src/content/articles/hey-its-that-guy.mdx
          git commit -m "Publish Tales from the Crypt article"
          git push origin main
