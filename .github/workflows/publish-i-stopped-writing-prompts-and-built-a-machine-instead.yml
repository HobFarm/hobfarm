name: Publish I Stopped Writing Prompts and Built a Machine Instead

on:
  schedule:
    - cron: "20 23 24 8 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-i-stopped-writing-prompts-and-built-a-machine-instead
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Publish when the scheduled time has arrived
        id: article
        run: node scripts/publish-scheduled-i-stopped-writing-prompts-and-built-a-machine-instead.mjs

      - name: Remove the one-time schedule and trigger the production build
        if: steps.article.outputs.published == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-i-stopped-writing-prompts-and-built-a-machine-instead.yml
          git rm scripts/publish-scheduled-i-stopped-writing-prompts-and-built-a-machine-instead.mjs
          git add src/content/articles/i-stopped-writing-prompts-and-built-a-machine-instead.mdx
          git commit -m "Publish I Stopped Writing Prompts and Built a Machine Instead"
          git push origin main
