name: Publish Trash Mountain

on:
  schedule:
    - cron: "20 23 11 8 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-trash-mountain
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Publish when the scheduled time has arrived
        id: article
        run: node scripts/publish-scheduled-trash-mountain.mjs

      - name: Remove the one-time schedule and trigger the production build
        if: steps.article.outputs.published == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-trash-mountain.yml
          git add src/content/articles/trash-mountain.mdx
          git commit -m "Publish Trash Mountain"
          git push origin main
