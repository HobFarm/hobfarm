name: Publish Hermit Does Not Have to Pay for Repairs

on:
  schedule:
    - cron: "20 23 6 8 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-hermit
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Publish when the scheduled time has arrived
        id: article
        run: node scripts/publish-scheduled-hermit.mjs

      - name: Remove the one-time schedule and trigger the production build
        if: steps.article.outputs.published == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-hermit.yml
          git add src/content/articles/hermit-does-not-have-to-pay-for-repairs.mdx
          git commit -m "Publish Hermit Does Not Have to Pay for Repairs"
          git push origin main
