name: Publish The Salton Sea Needs an Outlet

on:
  schedule:
    - cron: "20 23 25 8 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-salton-sea-needs-an-outlet
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Publish when the scheduled time has arrived
        id: article
        run: node scripts/publish-scheduled-salton-sea-needs-an-outlet.mjs

      - name: Remove the one-time schedule and trigger the production build
        if: steps.article.outputs.published == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-salton-sea-needs-an-outlet.yml
          git rm scripts/publish-scheduled-salton-sea-needs-an-outlet.mjs
          git add src/content/articles/salton-sea-needs-an-outlet.mdx
          git commit -m "Publish The Salton Sea Needs an Outlet"
          git push origin main
