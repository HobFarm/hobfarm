name: Publish Same Same, But Different

on:
  schedule:
    - cron: "20 23 12 8 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-same-same-but-different
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Publish when the scheduled time has arrived
        id: article
        run: node scripts/publish-scheduled-same-same-but-different.mjs

      - name: Remove the one-time schedule and trigger the production build
        if: steps.article.outputs.published == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-same-same-but-different.yml
          git rm scripts/publish-scheduled-same-same-but-different.mjs
          git add src/content/articles/same-same-but-different.mdx
          git commit -m "Publish Same Same, But Different"
          git push origin main
