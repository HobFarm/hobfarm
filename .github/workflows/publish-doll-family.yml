name: Publish the Doll Family article

on:
  schedule:
    - cron: "45 6 27 7 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-doll-family
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Publish when the scheduled time has arrived
        id: article
        run: node scripts/publish-scheduled-doll-family.mjs

      - name: Remove the one-time schedule and trigger the production build
        if: steps.article.outputs.published == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-doll-family.yml
          git add src/content/articles/they-had-names-doll-family.mdx
          git commit -m "Publish Doll Family article"
          git push origin main
