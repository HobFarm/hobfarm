name: Publish EC Machine Article

on:
  schedule:
    - cron: "25 0 5 8 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-ec-machine
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Publish when the scheduled time has arrived
        id: article
        run: node scripts/publish-scheduled-ec-machine.mjs

      - name: Remove the one-time schedule and trigger the production build
        if: steps.article.outputs.published == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-ec-machine.yml
          git add src/content/articles/ec-machine.mdx
          git commit -m "Publish EC machine article"
          git push origin main
