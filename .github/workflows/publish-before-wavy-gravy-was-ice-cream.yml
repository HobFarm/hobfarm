name: Publish Before Wavy Gravy Was Ice Cream

on:
  schedule:
    - cron: "20 23 18 8 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-before-wavy-gravy-was-ice-cream
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Publish when the scheduled time has arrived
        id: article
        run: node scripts/publish-scheduled-before-wavy-gravy-was-ice-cream.mjs

      - name: Remove the one-time schedule and trigger the production build
        if: steps.article.outputs.published == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-before-wavy-gravy-was-ice-cream.yml
          git rm scripts/publish-scheduled-before-wavy-gravy-was-ice-cream.mjs
          git add src/content/articles/before-wavy-gravy-was-ice-cream.mdx
          git commit -m "Publish Before Wavy Gravy Was Ice Cream"
          git push origin main
