name: Publish The Model Is Free

on:
  schedule:
    - cron: "20 23 13 8 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-the-model-is-free
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Publish when the scheduled time has arrived
        id: article
        run: node scripts/publish-scheduled-the-model-is-free.mjs

      - name: Remove the one-time schedule and trigger the production build
        if: steps.article.outputs.published == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-the-model-is-free.yml
          git add src/content/articles/the-model-is-free.mdx
          git commit -m "Publish The Model Is Free"
          git push origin main
