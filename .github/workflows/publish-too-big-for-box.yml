name: Publish Too Big for the Box

on:
  schedule:
    - cron: "25 0 30 7 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-too-big-for-box
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Publish when the scheduled time has arrived
        id: article
        run: node scripts/publish-scheduled-too-big-for-box.mjs

      - name: Remove the one-time schedule and trigger the production build
        if: steps.article.outputs.published == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-too-big-for-box.yml
          git add src/content/articles/too-big-for-the-box.md
          git commit -m "Publish Too Big for the Box article"
          git push origin main
