name: Publish I Want My MTV

on:
  schedule:
    - cron: "20 23 16 8 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-i-want-my-mtv
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Publish when the scheduled time has arrived
        id: article
        run: node scripts/publish-scheduled-i-want-my-mtv.mjs

      - name: Remove the one-time schedule and trigger the production build
        if: steps.article.outputs.published == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-i-want-my-mtv.yml
          git rm scripts/publish-scheduled-i-want-my-mtv.mjs
          git add src/content/articles/i-want-my-mtv.mdx
          git commit -m "Publish I Want My MTV"
          git push origin main
